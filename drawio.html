<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>架构图编辑器 · Z-MAX</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#06080d;color:#c8d1d9;overflow:hidden;height:100vh;display:flex;flex-direction:column}
  #toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0d1117;border-bottom:1px solid #1a1f2b;flex-shrink:0;z-index:10;flex-wrap:wrap}
  #toolbar .logo{font-size:16px;font-weight:800;color:#00d4aa;margin-right:12px;white-space:nowrap}
  #toolbar a{color:#8b949e;text-decoration:none;font-size:13px;white-space:nowrap}
  #toolbar a:hover{color:#fff}
  #toolbar input{background:#06080d;border:1px solid #1a1f2b;border-radius:6px;padding:6px 12px;color:#c8d1d9;font-size:13px;width:200px;outline:none;flex-shrink:0}
  #toolbar input:focus{border-color:#00d4aa44}
  #toolbar button{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;flex-shrink:0}
  .btn-save{background:#00d4aa;color:#06080d}.btn-save:hover{background:#00ffcc}
  .btn-dark{background:#1a1f2b;color:#c8d1d9}.btn-dark:hover{background:#2a3040}
  .sep{width:1px;height:20px;background:#1a1f2b;flex-shrink:0}
  #status{font-size:11px;color:#484f58;margin-left:auto}
  #file-list{display:flex;align-items:center;gap:6px;overflow-x:auto;max-width:400px;flex-shrink:1}
  #file-list::-webkit-scrollbar{height:4px}
  #file-list::-webkit-scrollbar-thumb{background:#1a1f2b;border-radius:2px}
  .file-chip{background:#0d1117;border:1px solid #1a1f2b;border-radius:4px;padding:3px 10px;font-size:11px;color:#8b949e;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .file-chip:hover{border-color:#00d4aa44;color:#c8d1d9}
  .file-chip.active{border-color:#00d4aa;color:#00d4aa}
  #editor-wrap{flex:1;position:relative;overflow:hidden}
  #editor-wrap iframe{width:100%;height:100%;border:none}
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#06080d;z-index:5;gap:16px}
  .spinner{width:40px;height:40px;border:3px solid #1a1f2b;border-top-color:#00d4aa;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-tip{font-size:11px;color:#484f58}
  @media(max-width:768px){
    #toolbar{gap:6px;padding:8px 10px}
    #toolbar input{width:120px}
    #file-list{max-width:200px}
  }
</style>
</head>
<body>
<div id="toolbar">
  <span class="logo">Z-MAX</span>
  <a href="/">← 主页</a>
  <span class="sep"></span>
  <input id="fname" value="architecture" placeholder="文件名">
  <button class="btn-save" onclick="saveDiagram()">💾 保存</button>
  <button class="btn-dark" onclick="loadDiagram()">📂 加载</button>
  <button class="btn-dark" onclick="exportDiagram()">📥 导出SVG</button>
  <button class="btn-dark" onclick="newDiagram()">＋ 新建</button>
  <span class="sep"></span>
  <div id="file-list"></div>
  <span id="status"></span>
</div>
<div id="editor-wrap">
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-tip">正在加载 Draw.io 编辑器...</div>
  </div>
  <iframe id="drawio"></iframe>
</div>

<script>
var currentFile = '';

// ⚡ 先绑监听器，再设 iframe src，避免错过 init 事件
window.addEventListener('message', handleMessage);

(function initDrawio(){
  var params = new URLSearchParams(window.location.search);
  var file = params.get('file');
  if (file) { currentFile = file; document.getElementById('fname').value = file; }
  
  // ⏱ 超时兜底：15秒后如果还没收到 init，强制隐藏 loading
  setTimeout(function(){
    if (!editorReady){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('loading-tip').textContent = '⚠️ Draw.io 加载超时，请检查网络后刷新';
      document.getElementById('loading-tip').style.color = '#ff6b35';
      setStatus('⚠️ 编辑器加载超时 — 可能需要代理访问 embed.diagrams.net');
    }
  }, 15000);
  
  document.getElementById('drawio').src =
    'https://embed.diagrams.net/?embed=1&proto=json&spin=1&ui=kennedy&theme=dark';
  
  refreshList();
})();

var editorReady = false;
var _pendingAction = null;
var _attemptCount = 0;

function handleMessage(e){
  // 宽松匹配 origin：diagrams.net 可能走不同 CDN 子域
  if (!/diagrams\.net$/.test(e.origin)) return;
  
  var d;
  try { d = JSON.parse(e.data); }
  catch(err){ return; }  // 非 JSON 消息忽略
  
  _attemptCount++;
  
  if (d.event === 'init'){
    hideLoading();
    editorReady = true;
    if (currentFile) loadFromServer(currentFile);
    else setStatus('就绪 — 开始画架构图吧');
  }
  
  // draw.io 可能发 'configure' 而不是 'init'（新版 API）
  if (d.event === 'configure'){
    hideLoading();
    if (!editorReady){
      editorReady = true;
      if (currentFile) loadFromServer(currentFile);
      else setStatus('就绪 — 开始画架构图吧');
    }
  }
  
  if (d.event === 'export'){
    if (_pendingAction === 'save'){
      saveToServer(currentFile, d.data);
      _pendingAction = null;
    } else if (_pendingAction === 'export-svg'){
      downloadBlob(d.data, (currentFile||'architecture').replace('.drawio','')+'.svg', 'image/svg+xml');
      _pendingAction = null;
    }
  }
}

function hideLoading(){
  var el = document.getElementById('loading');
  if (el) el.style.display = 'none';
}

// ── 按钮操作 ──
function newDiagram(){
  currentFile = '';
  document.getElementById('fname').value = 'architecture';
  postMsg({action:'template'});
  setStatus('新建空白画布');
}

function saveDiagram(){
  var name = document.getElementById('fname').value.trim();
  if (!name){ setStatus('请输入文件名'); return; }
  if (!name.endsWith('.drawio')) name += '.drawio';
  currentFile = name;
  _pendingAction = 'save';
  postMsg({action:'export', format:'xmlpng'});
  setStatus('正在保存...');
}

function exportDiagram(){
  _pendingAction = 'export-svg';
  postMsg({action:'export', format:'svg'});
  setStatus('正在导出SVG...');
}

function loadDiagram(){ refreshList(); }

// ── 服务器操作 ──
function saveToServer(name, xml){
  fetch('/save-drawio.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name, xml: xml})
  }).then(function(r){return r.json()}).then(function(d){
    if (d.ok){ setStatus('💾 已保存: '+d.name+' ('+(d.size/1024).toFixed(1)+'KB)'); refreshList(); }
    else setStatus('❌ 保存失败: '+(d.error||''));
  }).catch(function(e){ setStatus('❌ 保存失败: '+e.message); });
}

function loadFromServer(name){
  fetch('/save-drawio.php?file='+encodeURIComponent(name)).then(function(r){
    if (!r.ok) throw new Error('404');
    return r.text();
  }).then(function(xml){
    hideLoading();
    postMsg({action:'load', xml: xml, autosave: 1});
    document.getElementById('fname').value = name;
    currentFile = name;
    setStatus('📂 已加载: '+name);
    refreshList();
  }).catch(function(e){
    hideLoading();
    setStatus('未找到文件，新建空白画布');
    postMsg({action:'template'});
  });
}

function refreshList(){
  fetch('/save-drawio.php').then(function(r){return r.json()}).then(function(files){
    var el = document.getElementById('file-list');
    el.innerHTML = files.map(function(f){
      var cls = (f.name === currentFile) ? 'file-chip active' : 'file-chip';
      return '<span class="'+cls+'" onclick="openFile(\''+f.name+'\')">'+f.name+'</span>';
    }).join('');
  });
}

function openFile(name){
  currentFile = name;
  document.getElementById('fname').value = name;
  document.getElementById('loading').style.display = 'flex';
  loadFromServer(name);
}

// ── 工具函数 ──
function postMsg(msg){
  var iframe = document.getElementById('drawio');
  if (iframe && iframe.contentWindow){
    iframe.contentWindow.postMessage(JSON.stringify(msg), '*');
  }
}

function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

function downloadBlob(data, filename, mime){
  var b = new Blob([data], {type: mime});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = filename;
  a.click();
  setStatus('📥 已下载: '+filename);
}
</script>
</body>
</html>

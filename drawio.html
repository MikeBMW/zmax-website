<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>架构图编辑器 · Z-MAX</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#06080d;color:#c8d1d9;height:100vh;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1117;border-bottom:1px solid #1a1f2b}
#bar .logo{font-weight:800;color:#00d4aa;font-size:15px;margin-right:8px}
#bar a{color:#8b949e;text-decoration:none;font-size:12px}
#bar input{background:#06080d;border:1px solid #1a1f2b;border-radius:4px;padding:5px 8px;color:#c8d1d9;font-size:12px;width:180px;outline:none}
#bar input:focus{border-color:#00d4aa44}
#bar button{padding:5px 10px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;border:none}
#bar select{background:#06080d;border:1px solid #1a1f2b;border-radius:4px;padding:5px 8px;color:#c8d1d9;font-size:12px;max-width:200px;outline:none}
.btn-save{background:#00d4aa;color:#06080d}
.btn-act{background:#1a1f2b;color:#c8d1d9}
.btn-act:hover{background:#2a3040}
#status{font-size:11px;color:#484f58;margin-left:auto;white-space:nowrap}
#wrap{flex:1;position:relative}
#wrap iframe{width:100%;height:100%;border:none}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#06080d;z-index:5;gap:12px}
.spin{width:36px;height:36px;border:3px solid #1a1f2b;border-top-color:#00d4aa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{font-size:11px;color:#484f58}
#msg{position:fixed;top:60px;right:20px;background:#0d1117;border:1px solid #00d4aa;border-radius:8px;padding:10px 16px;font-size:12px;color:#00d4aa;z-index:20;display:none;max-width:400px;word-break:break-all}
#msg.err{border-color:#ff4444;color:#ff4444}
@media(max-width:768px){#bar{gap:4px;padding:6px 8px}#bar input{width:100px}#bar select{max-width:120px}}
</style>
</head>
<body>

<div id="bar">
  <span class="logo">Z-MAX</span>
  <a href="/">←</a>
  <input id="fn" value="architecture" placeholder="文件名.drawio">
  <button class="btn-save" onclick="doSave()">💾 保存</button>
  <button class="btn-act" onclick="doLoad()">📂 加载</button>
  <select id="flist" onchange="onPick()"><option value="">-- 选择文件 --</option></select>
  <button class="btn-act" onclick="doExport()">📦 导出</button>
  <button class="btn-act" onclick="doNew()">＋新建</button>
  <span id="status">就绪</span>
</div>

<div id="wrap">
  <div id="load"><div class="spin"></div><p>加载 Draw.io...</p></div>
  <iframe id="dio"></iframe>
</div>
<div id="msg"></div>

<script>
var curFile='', _ready=false, _pending='';
var API='/save-drawio.php';

// 初始化
window.addEventListener('message', onMsg);
(function(){
  var p=new URLSearchParams(location.search), f=p.get('file');
  if(f){curFile=f;document.getElementById('fn').value=f}
  document.getElementById('dio').src='https://embed.diagrams.net/?embed=1&proto=json&spin=1&ui=kennedy&theme=dark';
  refreshSelect();
  setTimeout(function(){if(!_ready){hideLoad();msg('⚠️ Draw.io 加载超时，请刷新','err')}},15000);
})();

function onMsg(e){
  if(!/diagrams\.net$/.test(e.origin))return;
  var d; try{d=JSON.parse(e.data)}catch(_){return}
  if(d.event==='init'||d.event==='configure'){hideLoad();_ready=true;if(curFile)loadFile(curFile)}
  if(d.event==='export'){
    if(_pending==='save'){_pending='';var raw=decodeURI(d.data);saveFile(curFile,raw)}
    else if(_pending==='svg'){_pending='';download(d.data,(curFile||'arch').replace('.drawio','')+'.svg')}
  }
}

function hideLoad(){var e=document.getElementById('load');if(e)e.style.display='none'}
function setSt(s){document.getElementById('status').textContent=s}

// ---- 按钮 ----
function doNew(){curFile='';document.getElementById('fn').value='architecture';post({action:'template'});setSt('新画布')}
function doSave(){
  var n=document.getElementById('fn').value.trim();
  if(!n){msg('请输入文件名','err');return}
  if(!n.endsWith('.drawio'))n+='.drawio';
  curFile=n;_pending='save';post({action:'export',format:'xmlsvg'});setSt('保存中...')
}
function doLoad(){
  var n=document.getElementById('fn').value.trim();
  if(!n){refreshSelect();setSt('文件列表已刷新');return}
  if(!n.endsWith('.drawio'))n+='.drawio';
  curFile=n;document.getElementById('fn').value=n;
  document.getElementById('load').style.display='flex';
  loadFile(n);
  refreshSelect();
}
function doExport(){
  if(!curFile){msg('请先保存，再导出','err');return}
  fetch(API+'?file='+encodeURIComponent(curFile)).then(function(r){
    if(!r.ok)throw new Error('请先保存');
    return r.text();
  }).then(function(data){download(data,curFile);setSt('已导出 '+curFile)})
  .catch(function(e){msg('导出失败: '+e.message+' — 先点💾保存','err')});
}
function onPick(){
  var s=document.getElementById('flist'), n=s.value;
  if(!n)return;
  curFile=n;document.getElementById('fn').value=n;
  document.getElementById('load').style.display='flex';
  loadFile(n);
}

// ---- 服务器 ----
function saveFile(name,data){
  var payload=JSON.stringify({name:name,xml:data});
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:payload})
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok){setSt('已保存 '+d.name+' ('+(d.size/1024).toFixed(0)+'KB)');refreshSelect()}
    else setSt('保存失败: '+d.error);
  }).catch(function(e){setSt('保存失败: '+e.message)});
}

function loadFile(name){
  fetch(API+'?file='+encodeURIComponent(name)).then(function(r){
    if(!r.ok)throw new Error('404');
    return r.text();
  }).then(function(xml){
    hideLoad();post({action:'load',xml:xml,autosave:1});
    document.getElementById('fn').value=name;curFile=name;
    setSt('已加载 '+name);refreshSelect();
  }).catch(function(e){hideLoad();setSt('未找到 '+name);post({action:'template'})});
}

function refreshSelect(){
  fetch(API).then(function(r){return r.json()}).then(function(files){
    var s=document.getElementById('flist');
    s.innerHTML='<option value="">-- 选择文件 ('+files.length+') --</option>'+
      files.map(function(f){return '<option value="'+f.name+'">'+f.name+' ('+(f.size/1024).toFixed(0)+'KB)</option>'}).join('');
  });
}

// ---- 工具 ----
function post(m){var d=document.getElementById('dio');if(d&&d.contentWindow)d.contentWindow.postMessage(JSON.stringify(m),'*')}
function decodeURI(uri){var i=uri.indexOf(',');if(i<0)return uri;try{return atob(uri.substring(i+1))}catch(_){return uri}}
function download(data,filename){var b=new Blob([data]);var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click()}
function msg(t,cls){var e=document.getElementById('msg');e.textContent=t;e.className=cls||'';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},3000)}
</script>
</body>
</html>

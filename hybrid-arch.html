<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>混合架构 · Z-MAX</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#06080d;color:#c8d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0d1117;border-bottom:1px solid #1a1f2b;flex-shrink:0;z-index:10}
  #bar a{color:#8b949e;text-decoration:none;font-size:13px}
  #bar a:hover{color:#fff}
  #bar .title{font-size:15px;font-weight:700;color:#fff}
  .btn-edit{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:#00d4aa;color:#06080d;text-decoration:none;margin-left:auto}
  .btn-edit:hover{background:#00ffcc}
  #wrap{flex:1;position:relative}
  #wrap iframe{width:100%;height:100%;border:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06080d;font-size:14px;color:#8b949e}
  .spinner{width:36px;height:36px;border:3px solid #1a1f2b;border-top-color:#00d4aa;border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:768px){
    #bar{gap:8px;padding:8px 12px}
    .btn-edit{font-size:12px;padding:5px 10px}
  }
</style>
</head>
<body>
<div id="bar">
  <a href="/">← 主页</a>
  <span class="title">混合架构</span>
  <a href="/drawio.html?file=hybrid-arch.drawio" class="btn-edit">✏️ 编辑</a>
</div>
<div id="wrap">
  <div id="loading"><div class="spinner"></div>加载架构图...</div>
  <iframe id="viewer"></iframe>
</div>

<script>
// 先绑事件再设 src
window.addEventListener('message', function(e){
  if (!/diagrams\.net$/.test(e.origin)) return;
  var d;
  try { d = JSON.parse(e.data); } catch(err){ return; }
  if (d.event === 'init'){
    document.getElementById('loading').style.display = 'none';
  }
});

// 超时兜底
setTimeout(function(){
  document.getElementById('loading').style.display = 'none';
}, 12000);

// 加载 .drawio 文件到 viewer
var iframe = document.getElementById('viewer');
iframe.src = 'https://viewer.diagrams.net/?lightbox=1&highlight=0&edit=_blank&layers=1&nav=1&page-id=0&url=' +
  encodeURIComponent('https://datadrive.world/save-drawio.php?file=hybrid-arch.drawio');
</script>
</body>
</html>

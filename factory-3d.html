body{background:#06080d;color:#c8d1d9;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{background:#0d1117;padding:8px 16px;border-bottom:1px solid #1a1f2b;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10}
#bar h1{font-size:14px;color:#00d4aa}
#bar a{font-size:10px;color:#484f58;border:1px solid #1a1f2b;border-radius:4px;padding:3px 8px;text-decoration:none}
#bar .badge{font-size:9px;padding:2px 6px;border-radius:3px;margin-left:8px}
.b-ok{background:#0d3320;color:#3fb950;border:1px solid #3fb95033}
.b-warn{background:#332010;color:#f0a500;border:1px solid #f0a50033}
#bar .nav{margin-left:auto;display:flex;gap:6px}
#bar .nav button{padding:5px 10px;font-size:10px;border:1px solid #1a1f2b;background:transparent;color:#8b949e;border-radius:5px;cursor:pointer}
#bar .nav button.active{background:#0d3320;color:#00d4aa;border-color:#00d4aa44}

#main{flex:1;display:flex;overflow:hidden}
#view3d{flex:1;position:relative;cursor:grab;min-width:0}
#view3d:active{cursor:grabbing}
#view3d canvas{display:block}

#panel{width:320px;background:#0d1117;border-left:1px solid #1a1f2b;overflow-y:auto;flex-shrink:0}
@media(max-width:900px){#panel{display:none;position:absolute;right:0;top:50px;bottom:0;z-index:20;width:280px}
  #panel.open{display:block}}

#panel h3{font-size:11px;color:#00d4aa;padding:10px 12px 4px;border-bottom:1px solid #1a1f2b}
.zone-card{background:#111827;border:1px solid #1a1f2b;border-radius:8px;padding:10px;margin:6px 10px;transition:all .2s}
.zone-card.active{border-color:#00d4aa}
.zone-card .zone-title{font-size:12px;font-weight:700;margin-bottom:2px}
.zone-card .zone-sub{font-size:9px;color:#484f58;margin-bottom:4px}
.zone-card .zone-stats{display:flex;gap:10px;font-size:9px;color:#8b949e}
.zone-card .zone-stats b{color:#3fb950}

#legend{position:absolute;bottom:12px;right:12px;z-index:5;background:rgba(13,17,23,.9);border:1px solid #1a1f2b;border-radius:8px;padding:8px 12px;font-size:9px}
#legend .row{display:flex;align-items:center;gap:5px;margin:2px 0}
#legend .dot{width:7px;height:7px;border-radius:4px}

#info-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,17,23,.95);border:1px solid #00d4aa44;border-radius:10px;padding:14px 18px;z-index:10;display:none;max-width:300px;pointer-events:none}
#info-popup .name{font-size:13px;font-weight:700;color:#00d4aa}
#info-popup .desc{font-size:10px;color:#8b949e;margin:4px 0}
#info-popup .specs{display:flex;gap:10px}
#info-popup .spec{text-align:center}
#info-popup .spec .v{font-size:12px;font-weight:700;color:#3fb950}
#info-popup .spec .l{font-size:8px;color:#484f58}

.zone-card{cursor:pointer}
.zone-card .zone-process{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #1a1f2b}
.zone-card.expanded .zone-process{display:block}
.process-flow{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.process-step{background:#0d1117;border:1px solid #1a1f2b;border-radius:5px;padding:4px 6px;min-width:60px;text-align:center}
.process-step .st-id{font-size:11px;color:#00d4aa;font-weight:700;font-family:monospace}
.process-step .st-label{font-size:10px;font-weight:600;color:#c8d1d9}

.process-arrow{color:#00d4aa44;font-size:10px;flex-shrink:0}

#cursor-coord{position:fixed;pointer-events:none;z-index:20;background:rgba(0,212,170,.15);border:1px solid #00d4aa44;border-radius:4px;padding:2px 6px;font:9px monospace;color:#00d4aa;display:none}

// Coordinate labels — origin at bottom-left: display X=3dx+18, Y=-3dz+12
function addLabel(text,x,y,z,color,size){
  const w=size||1.2,h=(size||1.2)*.42;
  const cv=document.createElement("canvas");cv.width=128;cv.height=48;
  const cx=cv.getContext("2d");cx.font="bold 16px monospace";cx.textAlign="center";cx.textBaseline="middle";
  cx.fillStyle=color;cx.fillText(text,64,24);
  const tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide}));

// ═══════ Factory walls ═══════
function createWall(x,z,w,d,color){
  const g=new THREE.Group();
  // Floor tile
  const tile=new THREE.Mesh(new THREE.PlaneGeometry(w-.3,d-.3),new THREE.MeshStandardMaterial({color,roughness:.7,metalness:.1}));
  tile.rotation.x=-Math.PI/2;tile.position.y=.01;g.add(tile);
  // Border
  const borderGeom=new THREE.BoxGeometry(w,.08,.05);
  const bm=new THREE.MeshStandardMaterial({color:0x3a4050,metalness:.5});
  for(let [bx,bz,br] of [[0,-d/2,0],[0,d/2,0],[-w/2,0,Math.PI/2],[w/2,0,Math.PI/2]]){
    const b=new THREE.Mesh(borderGeom,bm);b.position.set(bx,.04,bz);if(br)b.rotation.y=br;g.add(b);
  }
  g.position.set(x,0,z);
  g.userData={isZone:true};
  return g;
}

function createTextLabel(text,x,y,z){
  // 3-line label: coords + I-Step + name
  const dx=Math.round((x+22)*10),dy=Math.round((-z+18)*10);
  const cv=document.createElement('canvas');cv.width=256;cv.height=80;
  const cx=cv.getContext('2d');
  cx.fillStyle='#ffffff';cx.font='bold 12px monospace';cx.textAlign='center';
  cx.fillText('('+dx+','+dy+')',128,16);
  cx.fillStyle='#00d4aa';cx.font='bold 16px monospace';
  cx.fillText(text,128,42);
  cx.fillStyle='#c8d1d9';cx.font='11px sans-serif';
  cx.fillText(y!==undefined?y:'',128,64);
  const tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.7),
    new THREE.MeshBasicMaterial({map:tx,transparent:true,depthTest:false,depthWrite:false}));
  plane.rotation.x=-Math.PI/2;
  plane.position.set(x,.02,z);plane.renderOrder=1001;
  return plane;
}

function createStation(x,z,color,label,specs){
  const g=new THREE.Group();
  // Heavy base
  const base=new THREE.Mesh(new THREE.BoxGeometry(.8,.25,.7),new THREE.MeshStandardMaterial({color:0x1a1a2e,roughness:.6}));
  base.position.y=.13;base.castShadow=base.receiveShadow=true;g.add(base);
  // Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(.7,.55,.5),new THREE.MeshStandardMaterial({color,roughness:.25,metalness:.4,emissive:color,emissiveIntensity:.1}));
  body.position.y=.5;body.castShadow=true;g.add(body);
  // Work surface
  const ws=new THREE.Mesh(new THREE.BoxGeometry(.6,.04,.35),new THREE.MeshStandardMaterial({color:0x445566,metalness:.6,roughness:.2}));
  ws.position.set(0,.28,.42);g.add(ws);
  // Screen
  g.add(new THREE.Mesh(new THREE.BoxGeometry(.3,.15,.02),new THREE.MeshBasicMaterial({color:0x002233}))).position.set(0,.58,.26);
  // Status light
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.04),new THREE.MeshBasicMaterial({color}))).position.set(.28,.78,.2);
  
  g.position.set(x,0,z);
  g.userData={label,color,specs,isStation:true};
  return g;
}

// ═══════ AGV cart ═══════
function createAGV(x,z,bodyColor,stripeColor){
  const g=new THREE.Group();
  const bc=bodyColor||0x00ffcc;
  const sc=stripeColor||0xffffff;
  // Body — emissive glow on dark background
  g.add(new THREE.Mesh(new THREE.BoxGeometry(.5,.15,.35),
    new THREE.MeshStandardMaterial({color:bc,metalness:.2,roughness:.4,emissive:bc,emissiveIntensity:.5})));
  g.children[0].position.y=.12;g.children[0].castShadow=true;
  // Cargo — bright stripe
  g.add(new THREE.Mesh(new THREE.BoxGeometry(.4,.2,.3),
    new THREE.MeshStandardMaterial({color:sc,metalness:.2,roughness:.4,emissive:sc,emissiveIntensity:.4})));
  g.children[1].position.y=.3;
  // Beacon — pulsing bright
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.04),
    new THREE.MeshBasicMaterial({color:bc})));
  g.children[2].position.set(.2,.30,.12);
  // Wheels
  for(let [sx,sz] of[[-.18,.14],[-.18,-.14],[.18,.14],[.18,-.14]]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.03,10),
      new THREE.MeshStandardMaterial({color:0x444444,metalness:.6,roughness:.2}));
    w.rotation.z=Math.PI/2;w.position.set(sx,.05,sz);g.add(w);
  }
  g.position.set(x,.03,z);
  g.userData={isAGV:true};
  return g;
}

// ═══════ Floor zone labels ═══════
function createFloorLabel(text,x,z){
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.font='bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,256,64);
  const tex=new THREE.CanvasTexture(canvas);
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false});
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),mat);
  plane.rotation.x=-Math.PI/2;plane.position.set(x,.02,z);
  plane.renderOrder=999;
  return plane;
}

// ═══════ Coordinate sprite (small label on ground) ═══════
function createCoordSprite(x3d,z3d,color,sizeMul){
  const dx=(x3d+18)*10,dy=(-z3d+12)*10;
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;
  const cx=cv.getContext('2d');
  cx.fillStyle=color||'#8b949e';cx.font='bold 18px monospace';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('('+dx.toFixed(0)+','+dy.toFixed(0)+')',128,32);
  const tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(3.2,.8),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthTest:false,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x3d,.018,z3d);m.renderOrder=997;
  return {sprite:m,canvas:cv,ctx:cx,texture:tx};
}

function updateCoordSprite(cs,x3d,z3d){
  const dx=(x3d+18)*10,dy=(-z3d+12)*10;
  cs.ctx.clearRect(0,0,256,64);
  cs.ctx.fillStyle=cs.ctx.fillStyle||'#00d4aa';
  cs.ctx.font='bold 18px monospace';
  cs.ctx.textAlign='center';cs.ctx.textBaseline='middle';
  cs.ctx.fillText('('+dx.toFixed(0)+','+dy.toFixed(0)+')',128,32);
  cs.texture.needsUpdate=true;
  cs.sprite.position.set(x3d,.018,z3d);
}

// ═══════ Build factory ═══════
function buildFactory(){
  // Clear
  while(scene.children.length>7){
    const c=scene.children[7];
    if(c.userData&&(c.userData.isStation||c.userData.isZone||c.userData.isRobot||c.userData.isAGV)) scene.remove(c);
    else break;
  }
  stationObjects=[];

  // Zone floors
  ZONES.forEach(z=>{
    const wall=createWall(z.pos.x,z.pos.z,z.size.w,z.size.d,z.color);
    scene.add(wall);
    scene.add(createFloorLabel(z.name,z.pos.x,z.pos.z));
  });

  // Rails removed — clean layout

  // ═══ Robot rails — dual beam + ties, 2m gap from stations ═══
  ZONES.forEach(z=>{
    const cols=z.gridCols||8;
    const rows=Math.ceil(z.stations.length/cols);
    const zStep=(z.size.d-3)/Math.max(rows-1,1);
    for(let row=0;row<Math.min(rows,3);row++){
      const sz=z.pos.z-z.size.d/2+1.5+row*(rows>1?zStep:0);
      const railZ=sz-2.0;  // 2m gap from station
      const sx0=z.pos.x-z.size.w/2+1.5;
      const sx1=z.pos.x-z.size.w/2+1.5+(cols-1)*((z.size.w-3)/Math.max(cols-1,1));
      const len=sx1-sx0;
      const railMat=new THREE.MeshStandardMaterial({color:0x889999,metalness:.8,roughness:.2});
      const tieMat=new THREE.MeshStandardMaterial({color:0x4a4a4a});
      // Dual rail beams
      for(let bz of[-.15,.15]){
        const beam=new THREE.Mesh(new THREE.BoxGeometry(len,.04,.05),railMat);
        beam.position.set((sx0+sx1)/2,.02,railZ+bz);scene.add(beam);
      }
      // Cross ties every 1.2m
      for(let sx=sx0;sx<=sx1+.1;sx+=1.2){
        const tie=new THREE.Mesh(new THREE.BoxGeometry(.06,.012,.35),tieMat);
        tie.position.set(sx,.012,railZ);scene.add(tie);
      }
      // Yellow safety strip between rail and stations
      const strip=new THREE.Mesh(new THREE.PlaneGeometry(len,.2),
        new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:.18,side:THREE.DoubleSide}));
      strip.rotation.x=-Math.PI/2;strip.position.set((sx0+sx1)/2,.013,sz-1.0);scene.add(strip);
    }
  });

  // ═══ AMR corridors — cross-shaped main paths ═══
  function addCorridor(x1,z1,x2,z2,color,w){
    const dx=x2-x1,dz=z2-z1,len=Math.sqrt(dx*dx+dz*dz);
    const g=new THREE.PlaneGeometry(w,len);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.08,side:THREE.DoubleSide}));
    m.rotation.x=-Math.PI/2;m.rotation.z=Math.atan2(dx,dz);
    m.position.set((x1+x2)/2,.012,(z1+z2)/2);scene.add(m);
  }
  addCorridor(-22,0,22,0,0x00d4aa,2.5);
  addCorridor(0,-18,0,18,0x00d4aa,2.5);

  // Remove old line-side warehouse and connector-to-rail
  // Connector shortened — no longer reaches to empty space

  // Stations — grid layout per zone
  ZONES.forEach(z=>{
    const cols=z.gridCols||5;
    z.stations.forEach((st,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const sx=z.pos.x-z.size.w/2+1.5+col*((z.size.w-3)/Math.max(cols-1,1));
      const sz=z.pos.z-z.size.d/2+1.5+row*2.2;
      const s=createStation(sx,sz,z.color,st.label,st.specs);
      s.userData={...s.userData,...st,zoneId:z.id,zoneName:z.name};
      scene.add(s);stationObjects.push(s);
      scene.add(createCoordSprite(sx,sz,z.color).sprite);

    const zx=z.pos.x,zz=z.pos.z,zw=z.size.w,zd=z.size.d;

      {x:zx-zw/2,z:zz-zd/2},{x:zx+zw/2,z:zz-zd/2},

      const pl=new THREE.Mesh(new THREE.PlaneGeometry(.6,.3),
        new THREE.MeshBasicMaterial({map:tx,transparent:true,depthTest:false,depthWrite:false}));
      pl.position.set(-16.5,.6,4.7);pl.renderOrder=1000;
      w1agv.nameSprite={sprite:pl,canvas:cv,ctx:cx,texture:tx};
      scene.add(pl);
      agvObjs.push(w1agv);
    });
  }
  agvPos={x:0,z:-6};agvTarget={x:0,z:-6};

  buildZonesList();
}

function buildZonesList(){
  let h="";
  ZONES.forEach(z=>{
    const clr='#'+z.color.toString(16).padStart(6,'0');
    const steps=z.stations.map(s=>
      '<span class="process-step" onclick="event.stopPropagation();openStation(\''+s.id+'\')" style="cursor:pointer">'+
        '<div class="st-id">'+s.id+'</div>'+
        '<div class="st-label">'+s.label+'</div>'+
      '</span>'
    ).join('<span class="process-arrow">→</span>');
    h+=`<div class="zone-card" id="zone-${z.id}" onclick="event.stopPropagation();toggleZone('${z.id}')">
      <div class="zone-title" style="color:${clr}" onclick="event.stopPropagation();flyTo('${z.id}')">${z.name}</div>
      <div class="zone-sub" style="display:flex;justify-content:space-between">
        <span>${z.stations.length}个工位</span>
        <span style="font-size:7px;color:#484f58">点击展开工艺▼</span>
      </div>
      <div class="zone-process">
        <div class="process-flow">${steps}</div>
        <a href="/${z.id}-process.html" target="_blank" style="display:block;margin-top:8px;padding:8px 12px;background:rgba(0,212,170,.08);border:1px solid #00d4aa33;border-radius:6px;color:#00d4aa;font-size:11px;text-align:center;text-decoration:none">📋 ${z.name} 完整工艺文档 →</a>
      </div>
    </div>`;
  });
  document.getElementById("zones-list").innerHTML=h;
}

function openStation(sid){
  const links={'I119':'/robot.html','I120':'/station-i120.html','I121':'/station-i142.html','I125':'/station-i201.html','I142':'/station-i142.html','I208':'/robot2.html','I215':'/robot.html','I247':'/station-i201.html'};
  const st=ZONES.flatMap(function(z){return z.stations}).find(function(s){return s.id===sid});
  const name=st?st.label:'';
  const did=sid.replace('I','I-');
  const zone=ZONES.find(function(z){return z.stations.some(function(s){return s.id===sid})});
  const seq=zone?zone.stations.findIndex(function(s){return s.id===sid})+1:sid;
  if(links[sid]){
    window.location.href=links[sid]+'?id='+encodeURIComponent(did)+'&name='+encodeURIComponent(name);
  }else{
    var p=document.getElementById('info-popup');
    p.innerHTML='<div class="name">'+seq+' '+name+'</div><div class="desc">'+(st?st.desc:'')+'</div>';
    p.style.display='block';setTimeout(function(){p.style.display='none'},5000);
  }
}
function toggleZone(zoneId){
  const card=document.getElementById('zone-'+zoneId);
  card.classList.toggle('expanded');
  // close others
  document.querySelectorAll('.zone-card').forEach(c=>{if(c!==card)c.classList.remove('expanded')});
}

// ═══════ Camera fly-to ═══════
function flyTo(zoneId){
  const z=ZONES.find(x=>x.id===zoneId);
  if(!z)return;
  const start={x:lookTarget.x,y:lookTarget.y,z:lookTarget.z};
  const end={x:z.pos.x,y:0,z:z.pos.z};
  const st=Date.now();
  function anim(){
    const t=Math.min((Date.now()-st)/800,1);
    const e=t<.5?2*t*t:-1+(4-2*t)*t;
    lookTarget.x=start.x+(end.x-start.x)*e;
    lookTarget.y=start.y+(end.y-start.y)*e;
    lookTarget.z=start.z+(end.z-start.z)*e;
    updateCam();
    if(t<1)requestAnimationFrame(anim);
  }
  anim();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".zone-card").forEach(c=>c.classList.remove("active"));
  const btn=document.querySelector(`.nav button[onclick*="${zoneId}"]`);
  if(btn)btn.classList.add("active");
  document.getElementById("zone-"+zoneId)?.classList.add("active");
}

// ═══════ Mouse interaction ═══════
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
view3d.addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/view3d.clientWidth)*2-1;
  mouse.y=-(e.clientY/view3d.clientHeight)*2+1;
  const cc=document.getElementById("cursor-coord");
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObject(floor);
  if(hits.length){const p=hits[0].point;cc.textContent='('+((p.x+18)*10).toFixed(0)+','+((-p.z+12)*10).toFixed(0)+')';cc.style.display='block';cc.style.left=(e.clientX+14)+'px';cc.style.top=(e.clientY-24)+'px'}
  else{cc.style.display='none'}
});
wrap.addEventListener("click",e=>{
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(stationObjects,true);
  if(hits.length>0){
    let obj=hits[0].object;
    while(obj&&!obj.userData.isStation)obj=obj.parent;
    if(obj&&obj.userData.isStation){
      const d=obj.userData;
      if(d.id==='I119'){
        window.location.href='/robot.html';
        return;
      }
      const popup=document.getElementById("info-popup");
      popup.innerHTML=`<div class="name">${d.id} ${d.label}</div>
        <div class="desc">${d.desc||""} · ${d.zoneName||""}</div>
        <div class="specs">${(d.specs||[]).map(s=>`<div class="spec"><div class="v">${s[0]}</div><div class="l">${s[1]}</div></div>`).join("")}</div>`;
      popup.style.display="block";
      setTimeout(()=>popup.style.display="none",3000);
    }
  }
});

// ═══════ Camera: left=orbit, middle=pan, wheel=zoom ═══════
let dragging=false,panning=false,prevMX=0,prevMY=0;
let camTheta=1.57,camPhi=.15,camDist=28;
let lookTarget={x:0,y:0,z:0};

function updateCam(){
  camera.position.set(
    lookTarget.x+camDist*Math.sin(camPhi)*Math.cos(camTheta),
    lookTarget.y+camDist*Math.cos(camPhi),
    lookTarget.z+camDist*Math.sin(camPhi)*Math.sin(camTheta)
  );
  camera.lookAt(lookTarget.x,lookTarget.y,lookTarget.z);
}
view3d.addEventListener("mousedown",e=>{
if(e.button===0){dragging=true;prevMX=e.clientX;prevMY=e.clientY}
  if(e.button===1){panning=true;prevMX=e.clientX;prevMY=e.clientY;e.preventDefault()}
});
view3d.addEventListener("mousemove",e=>{
  if(dragging){
    camTheta+=(e.clientX-prevMX)*.005;
    camPhi=Math.max(.15,Math.min(1.5,camPhi-(e.clientY-prevMY)*.005));
    prevMX=e.clientX;prevMY=e.clientY;
    updateCam();
  }
  if(panning){
    const right=new THREE.Vector3();camera.getWorldDirection(right);
    const up=new THREE.Vector3(0,1,0);
    const left=new THREE.Vector3().crossVectors(up,right).normalize();
    const worldUp=new THREE.Vector3().crossVectors(right,left).normalize();
    const dx=(e.clientX-prevMX)*.02,dy=(e.clientY-prevMY)*.02;
    lookTarget.x+=left.x*dx+worldUp.x*dy;
    lookTarget.y+=left.y*dx+worldUp.y*dy;
    lookTarget.z+=left.z*dx+worldUp.z*dy;
    prevMX=e.clientX;prevMY=e.clientY;
    updateCam();
  }
});
view3d.addEventListener("mouseup",()=>{dragging=false;panning=false});
view3d.addEventListener("wheel",e=>{
  e.preventDefault();
  camDist=Math.max(5,Math.min(40,camDist+e.deltaY*.03));
  updateCam();
},{passive:false});
view3d.addEventListener("auxclick",e=>e.preventDefault());
// Touch
view3d.addEventListener("touchstart",e=>{
  if(e.touches.length===1){dragging=true;prevMX=e.touches[0].clientX;prevMY=e.touches[0].clientY}
});
view3d.addEventListener("touchmove",e=>{
  if(!dragging||e.touches.length!==1)return;
  camTheta+=(e.touches[0].clientX-prevMX)*.005;
  camPhi=Math.max(.15,Math.min(1.5,camPhi-(e.touches[0].clientY-prevMY)*.005));
  prevMX=e.touches[0].clientX;prevMY=e.touches[0].clientY;
  updateCam();
});
view3d.addEventListener("touchend",()=>dragging=false);

// ═══════ Animation ═══════
let time=0;
function animate(){
  requestAnimationFrame(animate);time+=.016;
  
  // Robot movement — visit each station in row, left to right, loop
  robotObjs.forEach(r=>{
    const rowStations=stationObjects.filter(s=>
      s.userData.zoneId===r.zone&&Math.abs(s.position.z-r.railZ-1.5)<1.5
    ).sort((a,b)=>a.position.x-b.position.x);
    if(rowStations.length===0)return;
    const st=rowStations[r.stepIdx%rowStations.length];
    let tx=st.position.x,tz=r.railZ;
    const rdx=tx-r.pos.x,rdz=tz-r.pos.z;
    if(Math.abs(rdx)<.08&&Math.abs(rdz)<.08){
      const dwellTime=r.name==='Z4 AOI'&&st.userData.id==='I120'?180:150;
      if(r.dwell<dwellTime){r.dwell++;r.workAnim=Math.sin(r.dwell*.15)}
      else{r.dwell=0;r.stepIdx=(r.stepIdx+1)%rowStations.length}
    }
    if(r.dwell===0){r.pos.x+=rdx*.025;r.pos.z+=rdz*.025}
    r.obj.position.set(r.pos.x,.05,r.pos.z);
    r.obj.position.y+=Math.sin(time*2.5+r.pos.x)*.02+(r.dwell>0?.02:0);
    r.obj.rotation.y=rdx>0?Math.PI/2:-Math.PI/2;
    if(r.coordSprite){updateCoordSprite(r.coordSprite,r.pos.x,r.pos.z)};
    if(r.nameSprite){r.nameSprite.sprite.position.set(r.pos.x,1.6,r.pos.z)};
  });
  
  // AGV movement — 4台各自区内巡逻 + R1跟随AGV
  const AGV_PATROLS=[
    [{x:-19,z:-1},{x:-3,z:-1},{x:-3,z:-10},{x:-19,z:-10}],
    [{x:3,z:-1},{x:19,z:-1},{x:19,z:-10},{x:3,z:-10}],
    [{x:-19,z:1},{x:-3,z:1},{x:-3,z:10},{x:-19,z:10}],
    [{x:3,z:1},{x:19,z:1},{x:19,z:10},{x:3,z:10}],
  ];

  agvObjs.forEach((a,i)=>{
    if(a.isFollower){
      // R1跟随AGV — 跟在R1机器人后面
      const r1=robotObjs.find(function(r){return r.name===a.followRobot});
      if(!r1)return;
      // 计算R1运动方向，AGV跟在后面偏离0.8单位
      const st=stationObjects.filter(function(s){
        return s.userData.zoneId===r1.zone&&Math.abs(s.position.z-r1.rowZ)<1.5;
      }).sort(function(a,b){return a.position.x-b.position.x});
      if(st.length===0)return;
      const curSt=st[r1.stepIdx%st.length];
      const rdx=curSt.position.x-r1.pos.x;
      // AGV串行跟在机器人正后方
      const dist=a.followDist||1.2;
      let ox=0,oz=dist;
      if(Math.abs(rdx)>.05){ox=rdx>0?-dist:dist;oz=0} // 横向移动时后方=x方向偏移
      a.target={x:r1.pos.x+ox,z:r1.pos.z+oz};
      const adx=a.target.x-a.pos.x,adz=a.target.z-a.pos.z;
      a.pos.x+=adx*.04;a.pos.z+=adz*.04;
      a.obj.position.set(a.pos.x,.05,a.pos.z);
      if(a.nameSprite){a.nameSprite.sprite.position.set(a.pos.x,.6,a.pos.z)};
      if(Math.abs(adx)>.05)a.obj.rotation.y=adx>0?Math.PI/2:-Math.PI/2;
      else if(Math.abs(adz)>.05)a.obj.rotation.y=adz>0?0:Math.PI;
    }else{
      const path=AGV_PATROLS[i];
      const idx=Math.floor(time*0.25)%path.length;
      a.target=path[idx];
      const adx=a.target.x-a.pos.x,adz=a.target.z-a.pos.z;
      a.pos.x+=adx*.03;a.pos.z+=adz*.03;
      a.obj.position.set(a.pos.x,.03,a.pos.z);
      if(a.nameSprite){a.nameSprite.sprite.position.set(a.pos.x,.6,a.pos.z)};
      if(Math.abs(adx)>.05) a.obj.rotation.y=adx>0?Math.PI/2:-Math.PI/2;
      else if(Math.abs(adz)>.05) a.obj.rotation.y=adz>0?0:Math.PI;
    }
  });
  
  // Station lights
  stationObjects.forEach(s=>{
    const lt=s.children[4];
    if(lt)lt.scale.setScalar(1+Math.sin(time*3+s.position.x)*.2);
  });
  
  renderer.render(scene,camera);
}

buildFactory();
updateCam();
animate();
window.addEventListener("resize",()=>{
  renderer.setSize(view3d.clientWidth,view3d.clientHeight);
  camera.aspect=view3d.clientWidth/view3d.clientHeight;camera.updateProjectionMatrix();
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDS 5维时空数据空间 | Z-MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080d;color:#c8d1d9;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bar{background:#0d1117;padding:6px 12px;border-bottom:1px solid #1a1f2b;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:10;flex-wrap:wrap}
#bar h1{font-size:14px;color:#00d4aa}

.badge{padding:2px 6px;font-size:9px;border-radius:3px}
#canvas-wrap{flex:1;position:relative;cursor:grab}

#hud{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(13,17,23,.9);border:1px solid #1a1f2b;border-radius:8px;padding:6px 12px;font-size:10px;z-index:5;flex-wrap:wrap}

.dim-legend{position:absolute;top:12px;right:12px;background:rgba(13,17,23,.9);border:1px solid #1a1f2b;border-radius:8px;padding:10px 14px;font-size:10px;z-index:5;line-height:1.8}
.dim-legend .dim{display:flex;align-items:center;gap:6px;margin:3px 0}
@media(max-width:768px){#bar h1{font-size:12px}#hud{font-size:8px;gap:6px;padding:4px 8px}.dim-legend{font-size:8px;padding:6px 10px;top:40px;right:4px}}
</style>
<script src="/zmax-auth.js"></script>
</head>
<body>
<div id="bar">
  <a href="/">← 主页</a>
  <h1>🌐 DDS 5维时空数据空间</h1>
  <span class="badge" style="background:#1a1033;color:#a371f7">5D 时空</span>
  <span class="badge" style="background:#0d3320;color:#00d4aa">X·Y·Z 空间</span>
  <span class="badge" style="background:#1a1a2e;color:#f0a500">T 时间轴</span>
  <span class="badge" style="background:#331a1a;color:#ff6b35">S 语义层</span>
</div>
<div id="canvas-wrap">
  <div id="tip"></div>
  <div class="dim-legend">
    <div style="color:#fff;font-weight:700;margin-bottom:4px">5维时空</div>
    <div class="dim"><span class="dot" style="background:#58a6ff"></span> X·Y·Z — 空间位置</div>
    <div class="dim"><span class="dot" style="background:#f0a500"></span> T — 时间轴 ↑</div>
    <div class="dim"><span class="dot" style="background:#a371f7"></span> S — 语义层</div>
    <div style="margin-top:6px;padding-top:4px;border-top:1px solid #1a1f2b;color:#484f58;font-size:9px">
      <div>📍 感知层 · 传感器数据</div>
      <div>🔍 特征层 · 提取特征</div>
      <div>🧠 条件层 · 语义理解</div>
      <div>🎯 动作层 · 决策执行</div>
      <div>✅ 反馈层 · 闭环学习</div>
    </div>
  </div>
  <div id="hud">
    <span><span class="dot" style="background:#58a6ff"></span>X·Y·Z 空间</span>
    <span><span class="dot" style="background:#f0a500"></span>T 时间</span>
    <span><span class="dot" style="background:#00d4aa"></span>S 语义</span>
    <span style="color:#484f58">🖱旋转|滚轮缩放|点击节点</span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════
// DDS v4.0 — 5维时空数据空间
// 每个数据点包含: X·Y·Z(空间) + T(时间) + S(语义)
// ═══════════════════════════════════════

// Semantic layers (S 维度)
const SEMANTIC = {
  sensor:   {label:"📍 感知层",  y:-6, color:0x58a6ff, desc:"传感器原始数据 — 位置·力·图像·温度"},
  feature:  {label:"🔍 特征层",  y:-2, color:0x3fb950, desc:"特征提取 — 边缘·力峰·光谱·模式"},
  condition:{label:"🧠 条件层",  y:2,  color:0xa371f7, desc:"语义理解 — 场景识别·异常检测·状态判断"},
  action:   {label:"🎯 动作层",  y:6,  color:0x00d4aa, desc:"决策执行 — 力控插入·AOI·推入·分拣"},
  feedback: {label:"✅ 反馈层",  y:10, color:0xff6b35, desc:"闭环学习 — 成功率·轨迹优化·模型更新"}
};

// Data points — each has all 5 dimensions
// x,z = spatial position (映射到工厂产线坐标)
// y   = time progression (时间推进)
// s   = semantic layer
const DATA_POINTS = [
  // ═══ 感知层 — 传感器采集 ═══
  {id:"D001",x:-8,z:4,y:SEMANTIC.sensor.y,s:"sensor",name:"入料位 RGB-D",desc:"D405 深度图+RGB",links:["D010"]},
  {id:"D002",x:-4,z:4,y:SEMANTIC.sensor.y,s:"sensor",name:"入料位 力觉",desc:"六维力/力矩传感器",links:["D011"]},
  {id:"D003",x:0,z:4,y:SEMANTIC.sensor.y,s:"sensor",name:"工位1 触觉",desc:"触觉阵列 4×4",links:["D012"]},
  {id:"D004",x:4,z:4,y:SEMANTIC.sensor.y,s:"sensor",name:"工位2 温度",desc:"红外热成像",links:["D013"]},
  {id:"D005",x:8,z:4,y:SEMANTIC.sensor.y,s:"sensor",name:"工位3 激光",desc:"3D激光轮廓仪",links:["D014"]},
  {id:"D006",x:-8,z:0,y:SEMANTIC.sensor.y,s:"sensor",name:"COC区 扫码",desc:"二维码·MES绑定",links:["D015"]},
  {id:"D007",x:-4,z:0,y:SEMANTIC.sensor.y,s:"sensor",name:"OE区 光功率",desc:"光功率计实时监测",links:["D016"]},
  {id:"D008",x:4,z:0,y:SEMANTIC.sensor.y,s:"sensor",name:"MOD区 电测",desc:"BERT/BER/眼图",links:["D017"]},
  {id:"D009",x:8,z:0,y:SEMANTIC.sensor.y,s:"sensor",name:"WH区 RFID",desc:"出入库RFID扫描",links:["D018"]},

  // ═══ 特征层 — 信号处理 ═══
  {id:"D010",x:-7,z:3,y:SEMANTIC.feature.y,s:"feature",name:"深度边缘检测",desc:"Canny边缘·目标分割",links:["D019"]},
  {id:"D011",x:-3,z:3,y:SEMANTIC.feature.y,s:"feature",name:"力曲线特征",desc:"力峰检测·接触判断",links:["D019","D020"]},
  {id:"D012",x:1,z:3,y:SEMANTIC.feature.y,s:"feature",name:"触觉纹理",desc:"滑移检测·压力分布",links:["D020"]},
  {id:"D013",x:5,z:3,y:SEMANTIC.feature.y,s:"feature",name:"热特征提取",desc:"热点检测·温度梯度",links:["D021"]},
  {id:"D014",x:9,z:3,y:SEMANTIC.feature.y,s:"feature",name:"3D点云特征",desc:"平面拟合·位姿估计",links:["D022"]},
  {id:"D015",x:-7,z:0,y:SEMANTIC.feature.y,s:"feature",name:"序列号解析",desc:"OCR·型号匹配",links:["D023"]},
  {id:"D016",x:-3,z:0,y:SEMANTIC.feature.y,s:"feature",name:"光功率趋势",desc:"IL/RL时域变化率",links:["D024"]},
  {id:"D017",x:5,z:0,y:SEMANTIC.feature.y,s:"feature",name:"BER统计",desc:"误码率时间序列",links:["D025"]},
  {id:"D018",x:9,z:0,y:SEMANTIC.feature.y,s:"feature",name:"物流轨迹",desc:"AGV路径·停留时间",links:["D026"]},

  // ═══ 条件层 — 语义理解 ═══
  {id:"D019",x:-5,z:2,y:SEMANTIC.condition.y,s:"condition",name:"C001 插入就绪",desc:"位置对齐·姿态正确",links:["D027","D028"]},
  {id:"D020",x:0,z:2,y:SEMANTIC.condition.y,s:"condition",name:"C004 力控插入",desc:"Z向力 3N/6N/8N阈值",links:["D029"]},
  {id:"D021",x:4,z:2,y:SEMANTIC.condition.y,s:"condition",name:"C031 温度异常",desc:">60°C·自动降速",links:["D030"]},
  {id:"D022",x:8,z:2,y:SEMANTIC.condition.y,s:"condition",name:"C008 AOI触发",desc:"缺陷置信度>0.85",links:["D031"]},
  {id:"D023",x:-7,z:-1,y:SEMANTIC.condition.y,s:"condition",name:"C039 OE对准",desc:"透镜对准±0.5μm",links:["D032"]},
  {id:"D024",x:-3,z:-1,y:SEMANTIC.condition.y,s:"condition",name:"C045 IL超限",desc:"IL>0.5dB·标记NG",links:["D033"]},
  {id:"D025",x:5,z:-1,y:SEMANTIC.condition.y,s:"condition",name:"C051 BERT通过",desc:"BER<1E-12·PRBS31",links:["D034"]},
  {id:"D026",x:9,z:-1,y:SEMANTIC.condition.y,s:"condition",name:"C038 电池低电量",desc:"SOC<15%·回充",links:["D035"]},

  // ═══ 动作层 — 决策执行 ═══
  {id:"D027",x:-6,z:1,y:SEMANTIC.action.y,s:"action",name:"A01 取料执行",desc:"吸嘴取料·Z100L执行",links:["D036"]},
  {id:"D028",x:-2,z:1,y:SEMANTIC.action.y,s:"action",name:"A03 预插定位",desc:"视觉引导·对准笼口",links:["D036"]},
  {id:"D029",x:2,z:1,y:SEMANTIC.action.y,s:"action",name:"A04 力控插入⭐",desc:"核心力控 Z3N·闭环",links:["D037"]},
  {id:"D030",x:5,z:1,y:SEMANTIC.action.y,s:"action",name:"A01 急停安全",desc:"立即停止·回安全位",links:["D038"]},
  {id:"D031",x:8,z:1,y:SEMANTIC.action.y,s:"action",name:"A08 AOI检测",desc:"3D缺陷识别·分类",links:["D039"]},
  {id:"D032",x:-6,z:-2,y:SEMANTIC.action.y,s:"action",name:"A31 透镜耦合",desc:"有源对准·UV固化",links:["D040"]},
  {id:"D033",x:-2,z:-2,y:SEMANTIC.action.y,s:"action",name:"A10 放不良品",desc:"NG仓·标记批次",links:["D041"]},
  {id:"D034",x:4,z:-2,y:SEMANTIC.action.y,s:"action",name:"A42 BERT测试",desc:"PRBS31·60s·BERT",links:["D042"]},
  {id:"D035",x:9,z:-2,y:SEMANTIC.action.y,s:"action",name:"A47 AGV回充",desc:"自主导航·充电桩",links:["D043"]},

  // ═══ 反馈层 — 闭环学习 ═══
  {id:"D036",x:-4,z:-3,y:SEMANTIC.feedback.y,s:"feedback",name:"F01 插拔成功率",desc:"99.2%·+0.3% MoM",links:[]},
  {id:"D037",x:1,z:-3,y:SEMANTIC.feedback.y,s:"feedback",name:"F02 力控精度",desc:"±0.02mm·稳定",links:[]},
  {id:"D038",x:5,z:-3,y:SEMANTIC.feedback.y,s:"feedback",name:"F03 安全事件",desc:"0事故·365天",links:[]},
  {id:"D039",x:8,z:-3,y:SEMANTIC.feedback.y,s:"feedback",name:"F04 AOI检出率",desc:">99.7%·漏检0",links:[]},
  {id:"D040",x:-6,z:-4,y:SEMANTIC.feedback.y,s:"feedback",name:"F05 OE良率",desc:"98.5%·目标99%",links:[]},
  {id:"D041",x:-2,z:-4,y:SEMANTIC.feedback.y,s:"feedback",name:"F06 NG分类",desc:"自动分类·根因",links:[]},
  {id:"D042",x:4,z:-4,y:SEMANTIC.feedback.y,s:"feedback",name:"F07 BERT通过率",desc:"97.8%·800G",links:[]},
  {id:"D043",x:9,z:-4,y:SEMANTIC.feedback.y,s:"feedback",name:"F08 模型更新",desc:"每周增量训练",links:[]}
];

// ═══════ THREE.JS SETUP ═══════
const wrap=document.getElementById("canvas-wrap"),W=wrap.clientWidth,H=wrap.clientHeight;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06080d);
scene.fog=new THREE.FogExp2(0x06080d,0.0004);
const camera=new THREE.PerspectiveCamera(50,W/H,.5,80);
camera.position.set(0,2,28);camera.lookAt(0,2,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
wrap.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x334466,.5));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,15,10);scene.add(dl);

// ═══ 5D 时空框架 ═══

// 1. 时间轴 — 中央垂直光柱 (T 维度)
const timeAxisGeom=new THREE.CylinderGeometry(.08,.08,20,16);
const timeAxisMat=new THREE.MeshStandardMaterial({color:0xf0a500,emissive:0xf0a500,emissiveIntensity:.6,roughness:.3,metalness:.6});
const timeAxis=new THREE.Mesh(timeAxisGeom,timeAxisMat);timeAxis.position.y=2;scene.add(timeAxis);

// 时间刻度环
for(let y=SEMANTIC.sensor.y;y<=SEMANTIC.feedback.y+1;y+=1){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.25,.02,8,16),
    new THREE.MeshBasicMaterial({color:y%4===0?0xf0a500:0x4a3a1a,opacity:.4,transparent:true})
  );
  ring.position.y=y;scene.add(ring);
}

// 2. 语义层级平面 — 透明圆盘 (S 维度)
Object.values(SEMANTIC).forEach(s=>{
  const discGeom=new THREE.RingGeometry(.5,11,64);
  const disc=new THREE.Mesh(discGeom,new THREE.MeshBasicMaterial({
    color:s.color,side:THREE.DoubleSide,opacity:.04,transparent:true
  }));
  disc.rotation.x=-Math.PI/2;disc.position.y=s.y;scene.add(disc);

  // 语义层标签浮点
  const canvas=document.createElement("canvas");canvas.width=256;canvas.height=32;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#ffffff";ctx.font="bold 14px sans-serif";ctx.textAlign="center";
  ctx.fillText(s.label,128,20);
  const tex=new THREE.CanvasTexture(canvas);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.7}));
  sprite.scale.set(5,0.6,1);sprite.position.set(11.5,s.y,0);scene.add(sprite);
});

// 3. 空间参考网格 (X-Z 维度)
const grid=new THREE.GridHelper(24,20,0x1a2a3a,0x0a0f15);grid.position.y=SEMANTIC.sensor.y-1.5;scene.add(grid);

// 4. Stars background
const starsGeom=new THREE.BufferGeometry();
const starPos=new Float32Array(600*3);
for(let i=0;i<600*3;i+=3){starPos[i]=(Math.random()-.5)*50;starPos[i+1]=Math.random()*22-4;starPos[i+2]=(Math.random()-.5)*50}
starsGeom.setAttribute("position",new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starsGeom,new THREE.PointsMaterial({color:0x334466,size:.04})));

// ═══ 创建数据点 ═══
const allNodes=[],nodeMap={};

function mkDataPoint(dp){
  const s=SEMANTIC[dp.s];
  const g=new THREE.Group();
  // 主体
  const geom=dp.s==="sensor"?new THREE.OctahedronGeometry(.25):
             dp.s==="feature"?new THREE.IcosahedronGeometry(.22):
             dp.s==="condition"?new THREE.SphereGeometry(.28,16,16):
             dp.s==="action"?new THREE.BoxGeometry(.3,.3,.3):
             new THREE.TorusKnotGeometry(.2,.06,32,8);
  const mat=new THREE.MeshStandardMaterial({
    color:s.color,roughness:.2,metalness:.5,
    emissive:s.color,emissiveIntensity:.25
  });
  const mesh=new THREE.Mesh(geom,mat);g.add(mesh);
  // 光环
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.4,.015,8,16),
    new THREE.MeshBasicMaterial({color:s.color,opacity:.5,transparent:true})
  );
  g.add(ring);
  g.position.set(dp.x,dp.y,dp.z);
  g.userData={id:dp.id,label:dp.id+" "+dp.name,color:"#"+s.color.toString(16).padStart(6,"0"),desc:dp.desc+" ["+s.label+"]",links:dp.links,s:dp.s};
  scene.add(g);allNodes.push(g);nodeMap[dp.id]=g;
}
DATA_POINTS.forEach(mkDataPoint);

// ═══ 数据流连线 — 跨语义层+时间推进 ═══
DATA_POINTS.forEach(dp=>{
  if(!dp.links||!dp.links.length)return;
  const src=nodeMap[dp.id];if(!src)return;
  dp.links.forEach(tid=>{
    const tgt=nodeMap[tid];if(!tgt)return;
    // 曲线连接 — 体现时间流动
    const midY=(src.position.y+tgt.position.y)/2;
    const midX=(src.position.x+tgt.position.x)/2;
    const midZ=(src.position.z+tgt.position.z)/2;
    const curve=new THREE.QuadraticBezierCurve3(
      src.position,
      new THREE.Vector3(midX+1,midY,midZ),
      tgt.position
    );
    const points=curve.getPoints(32);
    const lineGeom=new THREE.BufferGeometry().setFromPoints(points);
    const sColor=SEMANTIC[dp.s].color;
    scene.add(new THREE.Line(lineGeom,new THREE.LineBasicMaterial({color:sColor,opacity:.08,transparent:true})));
  });
});

// ═══ 流动粒子 — T维度时间推进可视化 ═══
const flowParticles=[];
DATA_POINTS.filter(dp=>dp.links&&dp.links.length).forEach(dp=>{
  dp.links.forEach(tid=>{
    const src=nodeMap[dp.id],tgt=nodeMap[tid];
    if(!src||!tgt)return;
    const pGeom=new THREE.SphereGeometry(.06,4,4);
    const pMat=new THREE.MeshBasicMaterial({color:0x00d4aa,transparent:true,opacity:.8});
    for(let j=0;j<3;j++){
      const p=new THREE.Mesh(pGeom,pMat);
      p.userData={src:src.position.clone(),tgt:tgt.position.clone(),t:j*.3,speed:.002+.001*j};
      p.position.copy(src.position);
      scene.add(p);
      flowParticles.push(p);
    }
  });
});

// ═══ Camera control ═══
let drag=false,prev={x:0,y:0},ct=Math.PI/4,cp=.7,cd=28;
function uc(){
  camera.position.set(cd*Math.sin(cp)*Math.cos(ct), cd*Math.cos(cp)+2, cd*Math.sin(cp)*Math.sin(ct));
  camera.lookAt(0,2,0);
}
wrap.addEventListener("mousedown",e=>{if(e.button===0){drag=true;prev={x:e.clientX,y:e.clientY}}});
wrap.addEventListener("mousemove",e=>{if(!drag)return;ct+=(e.clientX-prev.x)*.004;cp=Math.max(.1,Math.min(1.5,cp-(e.clientY-prev.y)*.004));prev={x:e.clientX,y:e.clientY};uc()});
wrap.addEventListener("mouseup",()=>drag=false);
wrap.addEventListener("wheel",e=>{e.preventDefault();cd=Math.max(8,Math.min(50,cd+e.deltaY*.03));uc()},{passive:false});
wrap.addEventListener("touchstart",e=>{if(e.touches.length===1){drag=true;prev={x:e.touches[0].clientX,y:e.touches[0].clientY}}});
wrap.addEventListener("touchmove",e=>{if(!drag||e.touches.length!==1)return;ct+=(e.touches[0].clientX-prev.x)*.004;cp=Math.max(.1,Math.min(1.5,cp-(e.touches[0].clientY-prev.y)*.004));prev={x:e.touches[0].clientX,y:e.touches[0].clientY};uc()});
wrap.addEventListener("touchend",()=>drag=false);

// ═══ Click — 展示5维信息 ═══
const rc=new THREE.Raycaster(),ms=new THREE.Vector2();
wrap.addEventListener("click",e=>{
  ms.x=(e.clientX/wrap.clientWidth)*2-1;ms.y=-(e.clientY/wrap.clientHeight)*2+1;
  rc.setFromCamera(ms,camera);
  const hits=rc.intersectObjects(allNodes,true);
  if(hits.length>0){
    let o=hits[0].object;while(o&&!o.userData.label)o=o.parent;
    if(o&&o.userData.label){
      const d=o.userData,t=document.getElementById("tip");
      const sLayer=SEMANTIC[d.s];
      t.innerHTML=
        '<b style="color:'+d.color+'">'+d.label+'</b>'+
        '<div style="color:#8b949e;margin-top:2px">'+d.desc+'</div>'+
        '<div style="margin-top:4px;font-size:9px;display:flex;gap:8px;flex-wrap:wrap">'+
        '<span style="color:#58a6ff">📍 X:'+o.position.x.toFixed(1)+' Z:'+o.position.z.toFixed(1)+'</span>'+
        '<span style="color:#f0a500">⏱ T:'+o.position.y.toFixed(1)+'</span>'+
        '<span style="color:#'+sLayer.color.toString(16).padStart(6,'0')+'">🔖 S:'+sLayer.label+'</span>'+
        '</div>';
      t.style.display="block";t.style.left=Math.min(e.clientX+15,wrap.clientWidth-290)+"px";
      t.style.top=(e.clientY-50)+"px";
      setTimeout(()=>t.style.display="none",4000);
    }
  }
});

// ═══ Animate ═══
let time=0;
function anim(){
  requestAnimationFrame(anim);time+=.016;
  // 时间轴脉冲
  timeAxis.scale.y=1+Math.sin(time*1.5)*.03;
  timeAxis.material.emissiveIntensity=.5+Math.sin(time*2)*.15;
  // 数据点动画
  allNodes.forEach(n=>{
    const s=n.userData.s;
    if(s==="sensor")n.rotation.y+=.003;
    else if(s==="condition"){n.rotation.y+=.005;n.children[1]&&(n.children[1].rotation.z+=.008)}
    else if(s==="action"){n.rotation.y+=.004;n.rotation.x+=.002}
    else if(s==="feedback")n.children[1]&&(n.children[1].rotation.z-=.006);
  });
  // 流动粒子 — 沿时间轴推进
  flowParticles.forEach(p=>{
    p.userData.t+=p.userData.speed;
    if(p.userData.t>1)p.userData.t=0;
    p.position.lerpVectors(p.userData.src,p.userData.tgt,p.userData.t);
    p.material.opacity=.3+Math.sin(p.userData.t*Math.PI)*.7;
  });
  renderer.render(scene,camera);
}
anim();
window.addEventListener("resize",()=>{
  renderer.setSize(wrap.clientWidth,wrap.clientHeight);
  camera.aspect=wrap.clientWidth/wrap.clientHeight;camera.updateProjectionMatrix();
});
</script>
</body>

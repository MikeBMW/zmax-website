<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>制造原子技能 · Z-MAX</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#06080d;color:#c8d1d9;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px}
h1{color:#00d4aa;font-size:26px;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#8b949e;font-size:13px;margin-bottom:28px}
h2{color:#00d4aa;font-size:16px;margin:28px 0 10px;padding:6px 12px;background:#0d1117;border-left:3px solid #00d4aa;border-radius:0 4px 4px 0}
table{width:100%;border-collapse:collapse;background:#0d1117;border-radius:8px;overflow:hidden;margin:10px 0;font-size:11px;display:block;overflow-x:auto}
th{background:#00d4aa22;padding:7px 10px;text-align:left;color:#00d4aa;font-weight:700;white-space:nowrap;position:sticky;top:0}
td{padding:6px 10px;border-bottom:1px solid #1a1f2b;white-space:nowrap}
td.wrap{white-space:normal;max-width:200px}
tr:nth-child(even) td{background:#080c14}
.back-home{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:#0d1117;border:1px solid #00d4aa44;border-radius:8px;color:#00d4aa;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:20px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:10px;font-weight:700}
.tag-p0{background:#ff444422;color:#ff4444}
.tag-p1{background:#d4a80022;color:#d4a800}
.tag-p2{background:#00d4aa22;color:#00d4aa}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.stat{background:#0d1117;border:1px solid #1a1f2b;border-radius:8px;padding:12px 20px;text-align:center}
.stat-num{font-size:24px;font-weight:900;color:#00d4aa}
.stat-label{font-size:10px;color:#8b949e}
.footer{text-align:center;padding:30px;color:#8b949e;font-size:11px;border-top:1px solid #1a1f2b;margin-top:40px}
@media(max-width:768px){.wrap{padding:20px 12px}h1{font-size:22px}}
</style>
<script src="/dds-global.js"></script>
<script src="/zmax-auth.js"></script>
</head>
<body>
<div class="wrap">
<a href="/kanban.html" class="back-home">← 返回看板</a> &nbsp; <a href="/dds-data-space.html" style="color:#00d4aa;text-decoration:none;font-size:12px">🌐 数据空间 →</a>
<h1>🏭 制造原子技能</h1>
<p class="sub">制造业场景_具身机器人原子技能库 · 89条 · 8大类 · DDS驱动</p>

<div class="stats" id="stats"></div>
<div id="tables"></div>

<div class="footer">© 2026 智蜂创元 · datadrive.world</div>
</div>

<script>
fetch('/api/dds-all.php').then(function(r){return r.json()}).then(function(d){
  var cats = d.atomic_categories || [];
  var total = d.atomic_total || 0;
  
  // Stats
  var statsHtml = '<div class="stat"><div class="stat-num">'+total+'</div><div class="stat-label">原子技能</div></div>'+
    '<div class="stat"><div class="stat-num">'+cats.length+'</div><div class="stat-label">技能大类</div></div>';
  cats.forEach(function(c){ statsHtml += '<div class="stat"><div class="stat-num">'+c.cnt+'</div><div class="stat-label">'+c.category+'</div></div>'; });
  document.getElementById('stats').innerHTML = statsHtml;

  // Fetch full skill list from atomic API
  fetch('/api/dds-atomic-api.php').then(function(r){return r.json()}).then(function(skills){
    var byCat = {};
    skills.forEach(function(s){
      if (!byCat[s.category]) byCat[s.category] = [];
      byCat[s.category].push(s);
    });

    var phaseClass = {'P0-核心MVP':'tag-p0','P1-核心MVP':'tag-p1','P0-立即攻关/销售样机':'tag-p0','P0-优先销售/样机':'tag-p0'};
    var html = '';
    Object.keys(byCat).sort().forEach(function(cat){
      var items = byCat[cat];
      html += '<h2>'+cat+' ('+items.length+'条)</h2>';
      html += '<table><tr><th>ID</th><th>原子技能</th><th>定义</th><th>当前</th><th>目标</th><th>难度</th><th>优先</th><th>阶段</th><th>典型场景</th></tr>';
      items.forEach(function(s){
        var cls = phaseClass[s.phase] || '';
        html += '<tr>'+
          '<td style="font-family:monospace;color:#00d4aa">'+s.id+'</td>'+
          '<td style="color:#fff;font-weight:600">'+s.name+'</td>'+
          '<td class="wrap">'+(s.definition||'').substring(0,60)+'</td>'+
          '<td>'+s.maturity_now+'</td>'+
          '<td>'+s.maturity_target+'</td>'+
          '<td>'+s.difficulty+'</td>'+
          '<td style="font-weight:700">'+s.priority_score+'</td>'+
          '<td><span class="tag '+cls+'">'+(s.phase||'')+'</span></td>'+
          '<td class="wrap">'+(s.scene||'').substring(0,40)+'</td>'+
          '</tr>';
      });
      html += '</table>';
    });
    document.getElementById('tables').innerHTML = html;
  });
});
</script>
</body>
</html>

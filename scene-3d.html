<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>场景工厂 | Z-MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0f18;overflow:hidden;font-family:Arial,sans-serif}
canvas{display:block;position:absolute;top:0;left:0}
#bar{position:absolute;top:0;left:0;right:0;z-index:10;background:rgba(10,15,24,.9);padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1a2030}
#bar a{color:#8b949e;font-size:11px;text-decoration:none;padding:4px 10px;border-radius:4px;border:1px solid #1a2030}
#bar a.on{color:#00d4aa;border-color:#00d4aa;background:rgba(0,212,170,.1)}
#bar h1{font-size:13px;color:#00d4aa;margin-left:8px}
#info{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#555;font-size:10px;z-index:5}
#specs{position:absolute;bottom:40px;left:10px;z-index:5;font-size:10px;color:#8b949e;background:rgba(10,15,24,.8);padding:6px 10px;border-radius:6px;border:1px solid #1a2030}
#specs .v{color:#00d4aa;font-weight:700}
#steps{position:absolute;top:60px;right:10px;z-index:5;font-size:9px;color:#555;background:rgba(10,15,24,.8);padding:6px 10px;border-radius:6px;border:1px solid #1a2030}
#steps .on{color:#00d4aa;font-weight:700}
#json-btn{position:absolute;top:60px;left:10px;z-index:5;font-size:9px;color:#00d4aa;background:rgba(10,15,24,.8);padding:4px 8px;border-radius:4px;border:1px solid #00d4aa44;cursor:pointer}
#json-view{position:absolute;top:90px;left:10px;z-index:5;font-size:9px;color:#58a6ff;background:rgba(10,15,24,.95);padding:8px;border-radius:6px;border:1px solid #1a2030;max-width:320px;max-height:250px;overflow:auto;display:none;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<div id="bar">
  <a href="/">←</a>
  <a href="?scene=insert" class="on" id="tab-i">🔌 插拔</a>
  <a href="?scene=handle" id="tab-h">📦 搬运</a>
  <a href="?scene=aoi" id="tab-a">🔍 AOI</a>
  <h1 id="title">加载中...</h1>
</div>
<div id="specs"></div>
<div id="steps"></div>
<div id="json-btn" onclick="toggleJSON()">📋 JSON</div>
<div id="json-view"></div>
<div id="info">拖拽旋转 | 滚轮缩放</div>

<script src="/three.min.js"></script>
<script>
var SCENES={
  insert:{name:"插拔操作",kpi:{"成功率":">99.5%","节拍":"<3.8s","插入力":"<0.5N"},skills:["取料","移动","尝试插入","插入完成","松开"],slots:4,color:0x00d4aa},
  handle:{name:"料盘搬运",kpi:{"成功率":">99.8%","节拍":"<3.3s","负载":"≤10kg"},skills:["料盘识别","取料","初始化","循环守卫"],slots:12,color:0x58a6ff},
  aoi:{name:"AOI检测",kpi:{"准确率":">99%","节拍":"<7s","分辨率":"2μm"},skills:["AOI_1","AOI_2","AOI_3","AOI_4","AOI_5","AOI_6","AOI_PD","OK"],stations:7,color:0xa371f7}
};

var p=new URLSearchParams(location.search),st=p.get("scene")||"insert";
var D=SCENES[st]||SCENES.insert;

// Load custom JSON if exists
fetch("/scenes/scene_"+st+".json").then(r=>r.json()).then(d=>{D=d;refreshUI()}).catch(()=>refreshUI());

function refreshUI(){
  document.getElementById("title").textContent="● "+D.name;
  ["i","h","a"].forEach(function(x,i){var t=document.getElementById("tab-"+x);t.classList.toggle("on",["insert","handle","aoi"][i]===st)});
  var k="";for(var kk in D.kpi)k+='<span class="v">'+D.kpi[kk]+'</span> '+kk+'<br>';document.getElementById("specs").innerHTML=k;
  var s="";D.skills.forEach(function(sk,i){s+='<span class="'+(i===0?"on":"")+'">'+(i+1)+'. '+sk+'</span><br>'});document.getElementById("steps").innerHTML=s;
  window._JSON=D;
}
function toggleJSON(){var v=document.getElementById("json-view");v.style.display=v.style.display==="block"?"none":"block";v.textContent=JSON.stringify(window._JSON||D,null,2)}
refreshUI();

// Three.js
var scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0f18);
var camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,40);camera.position.set(3,1.8,4);camera.lookAt(0,0,0);
var renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x334466,1.2));
var dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,8,3);dl.castShadow=true;scene.add(dl);
scene.add(new THREE.PointLight(D.color||0x00d4aa,3,8));

scene.add(new THREE.GridHelper(6,20,0x1a2030,0x1a2030));
var fl=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshStandardMaterial({color:0x111520,roughness:.9}));
fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);

// Robot
var arm=new THREE.Group();scene.add(arm);
arm.add((function(){var m=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.15,32),new THREE.MeshStandardMaterial({color:0x2a3040,metalness:.8}));m.position.y=.075;return m})());
function seg(r,h,c,y){var g=new THREE.CylinderGeometry(r,r,h,16);var m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,metalness:.7,roughness:.3}));m.position.y=y;m.castShadow=true;return m}
arm.add(seg(.12,.6,0x3a4a5a,.45));arm.add(seg(.1,.5,0x4a5a6a,1.0));arm.add(seg(.08,.35,0x5a6a7a,1.4));arm.add(seg(.06,.25,D.color||0x00d4aa,1.65));
var grip=new THREE.Mesh(new THREE.BoxGeometry(.08,.06,.15),new THREE.MeshStandardMaterial({color:0x888888,metalness:.9}));grip.position.set(0,1.8,.05);arm.add(grip);
var flr=new THREE.Mesh(new THREE.BoxGeometry(.02,.1,.04),new THREE.MeshStandardMaterial({color:0x666666}));flr.position.set(-.04,1.85,.05);arm.add(flr);
var frr=flr.clone();frr.position.x=.04;arm.add(frr);

// Scene objects
var objs=new THREE.Group();scene.add(objs);
var nSlots=D.slots||D.stations||4;
if(st==="aoi"){
  for(var i=0;i<nSlots;i++){var a=(i/nSlots)*Math.PI*2;var x=Math.cos(a)*1.5,z=Math.sin(a)*1.5-1;var b=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.6,16),new THREE.MeshStandardMaterial({color:0x2a3a4a,emissive:0x001122,emissiveIntensity:.3}));b.position.set(x,.3,z);objs.add(b);var l=new THREE.Mesh(new THREE.BoxGeometry(.2,.005,.2),new THREE.MeshStandardMaterial({color:D.color,emissive:D.color,emissiveIntensity:.3}));l.position.set(x,.6,z);objs.add(l)}
}else if(st==="handle"){
  var tray=new THREE.Mesh(new THREE.BoxGeometry(1.2,.03,.8),new THREE.MeshStandardMaterial({color:0x8a7a5a,metalness:.5}));tray.position.set(0,.02,-1.2);objs.add(tray);
  var cols=nSlots>8?4:3;for(var r=0;r<Math.ceil(nSlots/cols);r++)for(var c=0;c<cols&&r*cols+c<nSlots;c++){var s=new THREE.Mesh(new THREE.BoxGeometry(.2,.005,.15),new THREE.MeshStandardMaterial({color:0x333}));s.position.set(-.45+c*.3,.04,-1.35+r*.2);objs.add(s)}
}else{
  var oven=new THREE.Mesh(new THREE.BoxGeometry(2,.8,.6),new THREE.MeshStandardMaterial({color:0x2a3040,metalness:.8}));oven.position.set(0,.4,-1.6);oven.castShadow=true;objs.add(oven);
  for(var i=0;i<nSlots;i++){var s=new THREE.Mesh(new THREE.BoxGeometry(.15,.05,.3),new THREE.MeshStandardMaterial({color:0x111,emissive:0x331100,emissiveIntensity:.5}));s.position.set(-.6+i*.4,.65,-1.45);objs.add(s)}
}

// Orbit control
var isDown=false,px=0,py=0,theta=0,phi=.7,dist=4,target=new THREE.Vector3(0,0,-.5);
function uc(){camera.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));camera.lookAt(target)}uc();
window.onmousedown=function(e){isDown=true;px=e.clientX;py=e.clientY};
window.onmousemove=function(e){if(!isDown)return;theta+=(e.clientX-px)*.005;phi=Math.max(.2,Math.min(1.5,phi-(e.clientY-py)*.005));px=e.clientX;py=e.clientY;uc()};
window.onmouseup=function(){isDown=false};
window.onwheel=function(e){dist=Math.max(1.5,Math.min(10,dist+e.deltaY*.005));uc()};
window.onresize=function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};

var t=0;
function ani(){requestAnimationFrame(ani);t+=.016;var g=Math.sin(t*2)*.03;flr.position.x=-.04-g;frr.position.x=.04+g;renderer.render(scene,camera)}ani();
</script>
</body></html>

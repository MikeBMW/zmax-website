<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI/CD Z-MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080d;color:#c8d1d9;font:12px -apple-system,"PingFang SC",sans-serif}
#bar{background:#0d1117;padding:6px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #1a1f2b}
#bar h1{font-size:14px;color:#00d4aa}#bar a{font-size:10px;color:#484f58;text-decoration:none}
.row{display:flex;gap:8px;padding:8px;flex-wrap:wrap}
.card{flex:1;min-width:180px;background:#0d1117;border:1px solid #1a1f2b;border-radius:6px;padding:8px}
.card h3{font-size:10px;color:#00d4aa;margin-bottom:4px}
.v{font-size:16px;font-weight:800;color:#00d4aa;text-align:center}.vl{font-size:9px;color:#8b949e;text-align:center}
#cam{width:100%;min-width:200px;min-height:150px;max-height:300px;display:block;border-radius:4px;background:#111}
.st{display:flex;flex-wrap:wrap;gap:3px;font-size:8px}
.st span{padding:1px 5px;border-radius:2px;border:1px solid #1a1f2b;color:#484f58}
.st .on{background:#00d4aa22;color:#00d4aa;font-weight:700;border-color:#00d4aa}
</style></head><body>
<div id="bar"><a href="/">←</a><h1>🔗 CI/CD</h1><span style="font-size:10px;color:#484f58;margin-left:auto" id="t">-</span></div>
<div class="row">
<div class="card"><h3>🤖 机器人</h3><div class="v" id="act">-</div><div class="vl">动作</div></div>
<div class="card"><h3>📷 实时画面</h3><img id="cam"><div class="vl" id="ci">-</div></div>
<div class="card" style="min-width:300px"><h3>📋 状态机</h3><div class="st" id="sm"></div></div>
</div>
<div class="row">
<div class="card"><div class="v" id="pkg">0</div><div class="vl">数据包</div></div>
<div class="card"><div class="v" id="up">0s</div><div class="vl">中继</div></div>
<div class="card"><div class="v" id="inf">0</div><div class="vl">推理</div></div>
</div>

<script>
var S=["料盘识别","AOI_1","AOI_2","AOI_3","AOI_4","AOI_5","AOI_6","AOI_PD","OK","初始化循环","取料","尝试插入第一次","循环守卫","扫码","抓取失败判定","拔出","插入完成","暂时松开","移动到治具插槽","等待测试结果"];

async function P(){
 var t=new Date().toLocaleTimeString();document.getElementById("t").textContent=t;
 try{
  var r=await fetch("/api/relay/status"),d=await r.json();
  document.getElementById("pkg").textContent=d.packages||0;
  document.getElementById("up").textContent=(d.uptime||0)+"s";
 }catch(e){}
 try{
  var o=await fetch("/orin/status"),od=await o.json();
  document.getElementById("inf").textContent=od.infer_count||0;
 }catch(e){}
 try{
  var p=await fetch("/api/relay/peek"),pd=await p.json();
  // Action
  var lb="IDLE";
  if(pd.frames&&pd.frames[0])lb=pd.frames[0].label||"IDLE";
  else if(pd.current_state)lb=pd.current_state;
  document.getElementById("act").textContent=lb;
  // State machine
  var sm="";
  for(var i=0;i<S.length;i++){var s=S[i];sm+="<span class=\""+(s===lb?"on":"")+"\">"+(s===lb?"▶ ":"")+s+"</span>"}
  document.getElementById("sm").innerHTML=sm;
  // Camera: prefer snapshot endpoint, fallback to frames
  document.getElementById("cam").src="/api/snapshot/latest?t="+Date.now();
  document.getElementById("ci").textContent="🟢 "+t;
 }catch(e){document.getElementById("ci").textContent="JS错误:"+e.message;console.error(e)}
}
setInterval(P,500);P();
</script></body></html>

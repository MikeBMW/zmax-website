<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI/CD Z-MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080d;color:#c8d1d9;font:12px -apple-system,"PingFang SC",sans-serif}
#bar{background:#0d1117;padding:6px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #1a1f2b}
#bar h1{font-size:14px;color:#00d4aa}#bar a{font-size:10px;color:#484f58;text-decoration:none}
.row{display:flex;gap:8px;padding:8px;flex-wrap:wrap}
.card{flex:1;min-width:180px;max-width:220px;background:#0d1117;border:1px solid #1a1f2b;border-radius:6px;padding:8px}
.card h3{font-size:10px;color:#00d4aa;margin-bottom:4px;white-space:nowrap}
.v{font-size:16px;font-weight:800;color:#00d4aa;text-align:center;min-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vl{font-size:9px;color:#8b949e;text-align:center}
#cam{width:100%;min-width:200px;min-height:150px;max-height:300px;display:block;border-radius:4px;background:#111}
.st{display:flex;flex-wrap:wrap;gap:3px;font-size:8px}
.st span{padding:1px 5px;border-radius:2px;border:1px solid #1a1f2b;color:#484f58}
.st .on{background:#00d4aa22;color:#00d4aa;font-weight:700;border-color:#00d4aa}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#333;margin-right:4px}
.dot.idle{background:#484f58}.dot.wait{background:#f0a500}.dot.ok{background:#00d4aa}
.btn-go{padding:3px 10px;border:1px solid #1a1f2b;border-radius:4px;background:#0d1117;color:#c8d1d9;font-size:10px;cursor:pointer}
.btn-go:hover{background:#00d4aa22;border-color:#00d4aa}
.stage{display:flex;align-items:center;font-size:10px}
.metric{text-align:center;padding:4px 8px}.metric .val{font-size:18px;font-weight:800;color:#00d4aa}.metric .lab{font-size:8px;color:#484f58}
</style></head><body>
<div id="bar"><a href="/">←</a><h1>🔗 CI/CD</h1><a href="/pipeline-scheme.html" style="font-size:10px;color:#f0a500">📋 完整方案</a><span style="font-size:10px;color:#484f58;margin-left:auto" id="t">-</span></div>
<div class="row">
<div class="card"><h3>🤖 机器人</h3><div class="v" id="act">-</div><div class="vl">动作</div></div>
<div class="card"><h3>📷 实时画面</h3><img id="cam"><div class="vl" id="ci">-</div></div>
<div class="card" style="min-width:300px"><h3>📋 状态机</h3><div class="st" id="sm"></div></div>
</div>
<div class="row">
<div class="card"><div class="v" id="pkg">0</div><div class="vl">数据包</div></div>
<div class="card"><div class="v" id="up">0s</div><div class="vl">中继</div></div>
<div class="card"><div class="v" id="inf">0</div><div class="vl">推理</div></div>
<div class="card"><div class="v" id="ver">-</div><div class="vl">版本</div></div>
<div class="card"><div class="v" id="loss">-</div><div class="vl">loss</div></div>
</div>
<div class="card" style="margin:8px"><h3>🖥 Orin 系统监控</h3>
<div class="row" style="padding:0">
<div class="metric" style="min-width:70px"><div class="val" style="font-size:14px" id="ocpu">-</div><div class="lab">CPU</div></div>
<div class="metric" style="min-width:70px"><div class="val" style="font-size:14px" id="ogpu">-</div><div class="lab">GPU</div></div>
<div class="metric" style="min-width:70px"><div class="val" style="font-size:14px" id="omem">-</div><div class="lab">内存</div></div>
<div class="metric" style="min-width:70px"><div class="val" style="font-size:14px" id="odisk">-</div><div class="lab">磁盘</div></div>
<div class="metric" style="min-width:70px"><div class="val" style="font-size:14px" id="onet">-</div><div class="lab">带宽</div></div>
<div class="metric" style="min-width:70px"><div class="val" style="font-size:14px" id="otmp">-</div><div class="lab">温度</div></div>
</div></div>
<div class="card" style="margin:8px"><h3>🔧 Simulink 三阶段训练控制</h3>
<div style="display:flex;gap:8px;align-items:center;padding:4px 0;flex-wrap:wrap">
  <div class="stage"><span class="dot wait" id="s1d"></span>① 数据采集<span style="font-size:8px;color:#484f58" id="s1t"></span></div>
  <span style="color:#333">→</span>
  <div class="stage"><span class="dot wait" id="s2d"></span>② 训练中<span style="font-size:8px;color:#484f58" id="s2t"></span></div>
  <span style="color:#333">→</span>
  <div class="stage"><span class="dot wait" id="s3d"></span>③ 部署推理<span style="font-size:8px;color:#484f58" id="s3t"></span></div>
</div>
<div style="display:flex;gap:6px;margin-top:4px">
  <button class="btn-go" onclick="trigger('collect')">📡 触发采集</button>
  <button class="btn-go" onclick="trigger('train')">🧠 触发训练</button>
  <button class="btn-go" style="background:#a371f7;color:#fff" onclick="trigger('deploy')">🚀 触发部署</button>
</div>
<div id="meta-info" style="font-size:9px;color:#484f58;margin-top:4px">等待数据...</div>
</div>

<script>
var S=["料盘识别","AOI_1","AOI_2","AOI_3","AOI_4","AOI_5","AOI_6","AOI_PD","OK","初始化循环","取料","尝试插入第一次","循环守卫","扫码","抓取失败判定","拔出","插入完成","暂时松开","移动到治具插槽","等待测试结果"];

async function P(){
 var t=new Date().toLocaleTimeString();document.getElementById("t").textContent=t;
 try{
  var r=await fetch("/api/relay/status"),d=await r.json();
  document.getElementById("pkg").textContent=d.packages||0;
  document.getElementById("up").textContent=(d.uptime||0)+"s";
  if(d.packages>0){SS(1,"ok","数据流入");SS(2,"wait","等待");}else{SS(1,"idle","静止");}
 }catch(e){}
 try{
  var o=await fetch("/orin/status"),od=await o.json();
  document.getElementById("inf").textContent=od.infer_count||0;
  document.getElementById("ver").textContent="v"+(od.infer_count||0);
  if(od.infer_count>0){SS(3,"ok","推理中");}
  // System metrics (adapts to changing sys format)
  var sy=od.sys||{};
  document.getElementById("ocpu").textContent=(sy.cpu!=null?sy.cpu:"?")+"%";
  document.getElementById("ogpu").textContent=(sy.gpu!=null?sy.gpu+"%":"集成");
  document.getElementById("omem").textContent=(sy.mem_pct!=null?sy.mem_pct+"%":sy.mem!=null?sy.mem+"%":"?")+" · "+(sy.mem_used!=null?Math.round(sy.mem_used/1024)+"/"+Math.round(sy.mem_total/1024)+"G":"");
  document.getElementById("odisk").textContent=(sy.disk_pct!=null?sy.disk_pct+"%":sy.disk!=null?sy.disk+"%":"?")+" · "+(sy.disk_used!=null?Math.round(sy.disk_used)+"/"+Math.round(sy.disk_total)+"G":"");
  var nr=sy.net_rx||sy.net,nx=sy.net_tx||0;
  document.getElementById("onet").textContent=(nr!=null?Math.round(nr)+"↓"+Math.round(nx)+"↑KB/s":"-");
  if(sy.temp!=null)document.getElementById("otmp").textContent=sy.temp+"°C";
 }catch(e){}
 try{
  var p=await fetch("/api/relay/peek"),pd=await p.json();
  // Version & loss from meta
  var meta=pd.meta||{};
  // Shadow mode or regular frames
  if(pd.shadow){
    document.getElementById("act").textContent="影子模式";
    var sc=pd.shadow.count||0;
    document.getElementById("meta-info").textContent="影子对比:"+sc+"样本 · act_dim:"+(pd.shadow.act_dim||"?")+" · "+(pd.shadow.infer_ms_avg||0)+"ms";
  }
  if(meta.labels){var lbs=Object.entries(meta.labels).map(([k,v])=>k+":"+v).join(" · ");document.getElementById("meta-info").textContent="标签: "+lbs}
  if(meta.loss){document.getElementById("loss").textContent=meta.loss.toFixed(3)}
  // Action from frames or shadow mode
  var lb="待机";
  if(pd.shadow&&pd.shadow.count>0){
    // Check if last sample is recent (<10s old)
    var ss=pd.samples||[];
    var now=Date.now()/1000;
    if(ss.length&&(now-(ss[ss.length-1].ts||0))<10)lb="影子运行中";
  }
  else if(pd.frames&&pd.frames[0])lb=pd.frames[0].label||"IDLE";
  else if(pd.current_state)lb=pd.current_state;
  document.getElementById("act").textContent=lb;
  // State machine
  var sm="";
  for(var i=0;i<S.length;i++){var s=S[i];sm+="<span class=\""+(s===lb?"on":"")+"\">"+(s===lb?"▶ ":"")+s+"</span>"}
  document.getElementById("sm").innerHTML=sm;
  // Camera: prefer snapshot endpoint, fallback to frames
  document.getElementById("cam").src="/api/snapshot/latest?t="+Date.now();
  document.getElementById("ci").textContent="🟢 "+t;
 }catch(e){document.getElementById("ci").textContent="JS错误:"+e.message;console.error(e)}
}
setInterval(P,100);P();

// Three-stage status + trigger
function SS(id,c,txt){var d=document.getElementById("s"+id+"d");if(d){d.className="dot";if(c)d.classList.add(c)}var v=document.getElementById("s"+id+"t");if(v&&txt)v.textContent=txt}
function trigger(stage){
  if(stage==="collect"){SS(1,"ok","采集中");fetch("/api/relay/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"trigger_collect"})}).catch(()=>{});}
  else if(stage==="train"){SS(2,"ok","训练中");fetch("/api/relay/auto-iterate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"trigger_train"})}).catch(()=>{});}
  else if(stage==="deploy"){SS(3,"ok","部署中");fetch("/api/relay/trigger-deploy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"trigger_deploy"})}).catch(()=>{});}
  setTimeout(()=>P(),1000);
}
</script></body></html>

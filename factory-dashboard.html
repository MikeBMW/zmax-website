<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>工厂大屏 | Z-MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a10;color:#c8d1d9;font:13px -apple-system,"PingFang SC",sans-serif;padding:8px;min-height:100vh}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.top a{color:#00d4aa;font-size:11px;text-decoration:none;padding:3px 8px;border:1px solid #1a2030;border-radius:4px}
.top h1{font-size:14px;color:#00d4aa}
.kpis{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.kp{flex:1;min-width:50px;background:#0d1520;border-radius:6px;padding:6px 4px;text-align:center;border:1px solid #1a2030}
.kp .v{font-size:15px;font-weight:800;color:#00d4aa;line-height:1.2}.kp .l{font-size:8px;color:#555}
.cards{display:flex;flex-direction:column;gap:6px}
.card{background:#0d1520;border-radius:8px;padding:10px;border-left:3px solid #3fb950}
.card.w{border-left-color:#f0a500}.card.e{border-left-color:#ff4444}
.card .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .h .t{font-size:12px;color:#c8d1d9;font-weight:600}
.card .h .s{font-size:9px;padding:1px 6px;border-radius:3px}
.card .h .s.g{background:#3fb95022;color:#3fb950}.card .h .s.r{background:#ff444422;color:#ff4444}
.card .info{font-size:9px;color:#555;margin-bottom:4px}
.row{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:9px}
.row .l{flex:1;min-width:50px}.row .r{min-width:55px;text-align:right;font-weight:700}
.bar{flex:1;height:4px;background:#1a2030;border-radius:2px;min-width:40px}
.bar i{display:block;height:100%;border-radius:2px}
.g{color:#3fb950}.y{color:#f0a500}.r{color:#ff4444}
.bg-g{background:#3fb950}.bg-y{background:#f0a500}.bg-r{background:#ff4444}
</style>
</head>
<body>
<div class="top">
  <a href="/">←</a><a href="/factory-3d.html">🏭3D</a>
  <h1>🏭 光模块精细操作</h1>
  <span style="font-size:9px;color:#555;margin-left:auto" id="tick">-</span>
</div>
<div class="kpis">
  <div class="kp"><div class="v" id="ko">87%</div><div class="l">OEE</div></div>
  <div class="kp"><div class="v" id="kc">8.2s</div><div class="l">节拍</div></div>
  <div class="kp"><div class="v" id="ky">99.7%</div><div class="l">良率</div></div>
  <div class="kp"><div class="v" id="kr">6</div><div class="l">运行</div></div>
  <div class="kp"><div class="v" id="ka" style="color:#f0a500">1</div><div class="l">告警</div></div>
</div>
<div class="cards" id="cards"></div>

<script>
var D=[
  {n:"① 金线键合上料",z:"OE-I152",r:"Z700F",t:"5.2/6s",y:"99.6/99.5%",p:!0,s:"g",m:"FR-4·230×280mm·≤500g",stage:"INSERT",stageN:7},
  {n:"② 芯片贴装上下料",z:"OE-I136",r:"Z100L",t:"3.3/4s",y:"99.9/99.8%",p:!0,s:"g",m:"防静电料盒·≤1kg",stage:"TRANSFER",stageN:6},
  {n:"③ 透镜AA耦合",z:"OE-I171",r:"Z700",t:"8.5/10s",y:"99.7/99.5%",p:!0,s:"g",m:"3×3mm·<1g·防污",stage:"ALIGN",stageN:2},
  {n:"④ PEI Cover压合",z:"OE-I155",r:"Z700F",t:"12.5/15s",y:"100/99.9%",p:!0,s:"g",m:"40×30mm·8g·定位销",stage:"INSERT",stageN:7},
  {n:"⑤ 隔离器安装",z:"OE-I159",r:"Z700F",t:"17.2/20s",y:"99.8/99.7%",p:!0,s:"g",m:"5×5×3mm·1g·磁环",stage:"DESCEND",stageN:3},
  {n:"⑥ COC固晶绑定",z:"COC-I113",r:"Z700",t:"7.5/8s",y:"99.9/99.9%",p:!1,s:"e",m:"1×1mm·<0.5g·280°C ⚠",stage:"ALIGN",stageN:2}
];
var STAGES=["APPROACH","ALIGN","DESCEND","GRASP","LIFT","TRANSFER","INSERT","DONE"];

function R(){
  var h="",alarm=0;
  D.forEach(function(d){
    if(!d.p)alarm++;
    var cs=d.p?"":" e",ss=d.p?"g":"r";
    h+='<div class="card'+cs+'"><div class="h"><span class="t">'+d.n+'</span><span class="s '+ss+'">● '+(d.p?'运行':'告警')+'</span></div>';
    h+='<div class="info">'+d.z+' · '+d.r+' · <b>'+d.stage+'</b> ('+d.stageN+'/8) · '+d.m+'</div>';
    // Progress bars
    var tv=d.t.split("/"),yv=d.y.split("/");
    var tp=Math.min(100,parseFloat(tv[0])/parseFloat(tv[1])*100);
    var yp=Math.min(100,parseFloat(yv[0])/parseFloat(yv[1].replace("%",""))*100);
    h+='<div class="row"><span class="l">节拍</span><div class="bar"><i class="'+(tp<=100?'bg-g':tp<=110?'bg-y':'bg-r')+'" style="width:'+Math.min(100,tp)+'%"></i></div><span class="r '+(tp<=100?'g':tp<=110?'y':'r')+'">'+d.t+'</span></div>';
    h+='<div class="row"><span class="l">良率</span><div class="bar"><i class="'+(yp>=99.5?'bg-g':yp>=95?'bg-y':'bg-r')+'" style="width:'+Math.min(100,yp)+'%"></i></div><span class="r '+(yp>=99.5?'g':yp>=95?'y':'r')+'">'+d.y+'</span></div>';
    h+='</div>';
  });
  document.getElementById("cards").innerHTML=h;
  document.getElementById("ka").textContent=alarm;
  document.getElementById("ka").style.color=alarm>0?"#f0a500":"#3fb950";
  document.getElementById("tick").textContent=new Date().toLocaleTimeString();
}
R();setInterval(R,5000);

// API polling for real robot-action data
setInterval(function(){
  fetch("/robot-action.php/status?robot=R3").then(function(r){return r.json()}).then(function(d){
    if(d.metrics&&d.metrics.length){
      // Update robot card with live metrics
      var idx=D.findIndex(function(x){return x.r===d.robot});
      if(idx>=0){
        D[idx].stage=d.stage||D[idx].stage;
        D[idx].stageN=STAGES.indexOf(d.stage)+1||D[idx].stageN;
        D[idx].p=d.pass!==false;
        R();
      }
    }
  }).catch(function(){});
  // Orin heartbeat
  fetch("/orin/status").then(function(r){return r.json()}).then(function(d){
    if(d.online)document.getElementById("ko").textContent=(d.sys&&d.sys.cpu?Math.round(100-d.sys.cpu):87)+"%";
  }).catch(function(){});
},3000);
</script>
</body></html>

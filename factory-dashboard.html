<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工厂大屏 | Z-MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#060a10;color:#c8d1d9;font:15px "PingFang SC",sans-serif;padding:10px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-shrink:0}
.top a{color:#00d4aa;font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid #1a2030;border-radius:5px}
.top h1{font-size:18px;color:#00d4aa}.top span{font-size:11px;color:#555;margin-left:auto}
.kpis{display:flex;gap:6px;margin-bottom:8px;flex-shrink:0}
.kp{flex:1;background:#0d1520;border-radius:6px;padding:8px;text-align:center;border:1px solid #1a2030}
.kp .v{font-size:22px;font-weight:800;color:#00d4aa}.kp .l{font-size:10px;color:#555}
.main{display:flex;gap:8px;flex:1;min-height:0}
.left{width:30%;flex-shrink:0;display:flex;flex-direction:column}
.right{flex:1;display:flex;flex-direction:column}
.sec-title{font-size:12px;color:#f0a500;margin-bottom:4px;flex-shrink:0}
.robots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:1;align-content:stretch;overflow-y:auto}
.rb{background:#0d1520;border-radius:6px;padding:10px;border-left:3px solid #3fb950;display:flex;flex-direction:column;justify-content:center}
.rb.idle{border-left-color:#555}.rb.agv{border-left-color:#f0a500}
.rb .h{font-size:14px;color:#c8d1d9;font-weight:600}.rb .z{font-size:10px;color:#555}
.rb .m{display:flex;justify-content:space-between;margin:2px 0;font-size:12px}
.rb .m .val{color:#00d4aa;font-weight:700}.rb .m .lab{color:#555}
.scenes{display:flex;flex-direction:column;gap:6px;flex:1}
.sc{background:#0d1520;border-radius:6px;padding:12px;display:flex;align-items:center;gap:8px;border-left:3px solid #3fb950;flex:1;min-height:60px}
.sc.e{border-left-color:#ff4444}
.sc .icon{font-size:22px;min-width:28px;text-align:center}
.sc .info{flex:1;font-size:12px}.sc .info .n{color:#c8d1d9;font-weight:600;font-size:13px}.sc .info .d{font-size:10px;color:#555;line-height:1.3;margin:1px 0}
.sc .val{font-size:13px;font-weight:700;min-width:65px;text-align:right}
.g{color:#3fb950}.y{color:#f0a500}.r{color:#ff4444}
.flow{font-size:9px;color:#555;text-align:center;margin:2px 0}
.flow span{color:#00d4aa;margin:0 3px}
@media(max-width:768px){.main{flex-direction:column}.left{width:100%}}
</style>
</head>
<body>
<div class="top"><a href="/">←</a><a href="/factory-3d.html">🏭3D</a><a href="/supplier-model.html">📋场景</a><h1>🏭 光模块产线大屏 · 400G OSFP SR8</h1><span id="t">-</span></div>
<div class="kpis">
  <div class="kp"><div class="v" id="kmod">-</div><div class="l">今日光模块产量</div></div>
  <div class="kp"><div class="v" id="ko">-</div><div class="l">OEE·设备综合效率</div></div>
  <div class="kp"><div class="v" id="kc">-</div><div class="l">平均节拍</div></div>
  <div class="kp"><div class="v" id="ky">-</div><div class="l">良率</div></div>
  <div class="kp"><div class="v" id="kr">-</div><div class="l">运行台数</div></div>
  <div class="kp"><div class="v" id="ka">-</div><div class="l">告警</div></div>
  <div class="kp"><div class="v" id="kb">-</div><div class="l">数据包</div></div>
</div>
<div class="flow">COC基板 → 固晶(I113) → 贴片(I136) → 键合(I152) → <span>光引擎</span> → 耦合(I171) → Cover(I155) → 隔离器(I159) → AOI → <span>模块组装</span> → FW烧录(I119) → 老化(I142) → ATS检测(I215) → <span>400G OSFP SR8成品</span></div>
<div class="main">
  <div class="left">
    <div class="sec-title">🤖 机器人监控</div>
    <div class="robots" id="rs"></div>
  </div>
  <div class="right">
    <div class="sec-title">📋 五大场景 · BOM清单</div>
    <div class="scenes" id="ss"></div>
  </div>
</div>
<script>
/* BOM: 每颗400G OSFP SR8光模块物料清单 */
var BOM={vcsel8:1,pd8:1,driver:1,tia:1,dsp:1,lens_array:2,mpo16:1,osfp_housing:1,pcb:1,heatsink:1,total:11};
/* 生产流程: 每个I-Step工位对应的工作量(件/小时)和目标节拍 */
var STATIONS=[
  {id:"Z700-1",name:"精密操作·移动导航",zone:"COC-I113固晶",s:"run",sp:1.33,cy:45,ld:55,tp:42,scene:"SCN-02"},
  {id:"Z700-2",name:"精密操作·移动导航",zone:"OE-I171耦合",s:"run",sp:1.5,cy:40,ld:44,tp:39,scene:"SCN-02"},
  {id:"Z700-3",name:"精密操作·移动导航",zone:"光引擎-I155",s:"run",sp:1.2,cy:50,ld:38,tp:35,scene:"SCN-02"},
  {id:"Z700F-1",name:"精密操作·固定版",zone:"COC-I152键合",s:"run",sp:1.0,cy:60,ld:48,tp:41,scene:"SCN-01"},
  {id:"Z700F-2",name:"精密操作·固定版",zone:"OE-I159隔离器",s:"run",sp:0.92,cy:65,ld:35,tp:36,scene:"SCN-01"},
  {id:"Z100L-1",name:"物料搬运",zone:"COC 料盘流转",s:"run",sp:2.0,cy:30,ld:42,tp:38,scene:"SCN-03"},
  {id:"Z100L-2",name:"物料搬运",zone:"OE 治具对接",s:"run",sp:2.17,cy:28,ld:38,tp:35,scene:"SCN-04"},
  {id:"Z100L-3",name:"物料搬运",zone:"模块-I119烧录",s:"run",sp:1.5,cy:40,ld:30,tp:34,scene:"SCN-05"}
];
var AGV=[{id:"A1",route:"COC→OE",work:350},{id:"A2",route:"OE→模块",work:280},{id:"A3",route:"模块→成品",work:200},{id:"A4",route:"成品区→COC",work:150}];
var SCN=[
  {id:"SCN-01",n:"电口插拔(FW Loading)",d:"≤15s·±0.1mm",a:"取料→扫码→翻转→插入→拔出→AOI→分拣",eq:"I119+I120·Z700F×4",p:!0},
  {id:"SCN-02",n:"上下料(料盘/治具)",d:"L1±0.5mm·L2±0.1mm·L3±1μm",a:"料盘识别→穴位映射→抓取→治具对接→流转",eq:"I121+I125+I136·Z100L×3+Z700×2",p:!0},
  {id:"SCN-03",n:"老化箱插拔(BI)",d:"单颗≤6s·±0.5mm",a:"抽屉识别→拉出→批量插入→关闭→拔出→分拣",eq:"I142(12抽屉)·Z700F×2",p:!0},
  {id:"SCN-04",n:"热海柜体插拔",d:"≤20s·±0.5mm",a:"取料→插光口→插电口→等测试→拔出→分拣",eq:"I208(24槽位)·Z700F×2",p:!0},
  {id:"SCN-05",n:"ATS/线外检测插接",d:"核心·≤20s",a:"扫码→清洁→插光纤→插电口→测试→拔出→分拣",eq:"I215+I247·Z700×3",p:!0}
];

function renderAll(){
  var h="",run=0,eff=0,mods=0;
  STATIONS.forEach(function(r){
    if(r.s==="run"){run++;eff+=r.sp>0?85+Math.random()*15:0;mods+=r.sp>0?r.sp:0}
    var hourly=Math.round(r.sp*60);
    h+='<div class="rb'+(r.s==="idle"?" idle":"")+'"><div class="h">🤖 '+r.id+' <a href="/factory-3d.html" style="font-size:8px;color:#f0a500;text-decoration:none">📍'+r.zone.split('-')[0]+'</a></div><div class="z">'+r.name+' · '+r.zone+'</div>';
    h+='<div class="m"><span class="lab">工作量</span><span class="val">'+hourly+'件/h</span></div>';
    h+='<div class="m"><span class="lab">节拍</span><span class="val">'+r.cy+'s</span></div>';
    h+='<div class="m"><span class="lab">负载</span><span class="val">'+r.ld+'%</span></div>';
    h+='<div class="m"><span class="lab">温度</span><span class="val">'+r.tp+'°C</span></div></div>';
  });
  AGV.forEach(function(a){
    h+='<div class="rb agv"><div class="h">🚗 '+a.id+'</div><div class="z">AGV · '+a.route+'</div><div class="m"><span class="lab">转运量</span><span class="val">'+a.work+'件/h</span></div></div>';
  });
  document.getElementById("rs").innerHTML=h;
  document.getElementById("kr").textContent=run;
  document.getElementById("kmod").textContent=Math.round(mods*60*((new Date().getHours()-8)+new Date().getMinutes()/60));
  document.getElementById("ko").textContent=Math.round(eff/Math.max(1,run))+"%";
  document.getElementById("kc").textContent=(STATIONS.reduce(function(s,x){return s+x.cy},0)/STATIONS.length).toFixed(1)+"s";

  var sh="",alarm=0;
  SCN.forEach(function(s){
    if(!s.p)alarm++;
    sh+='<div class="sc'+(s.p?"":" e")+'"><div class="icon">'+(s.p?"🟢":"🔴")+'</div><div class="info"><div class="n">'+s.id+' '+s.n+'</div><div class="d">'+s.d+'</div><div class="d" style="color:#58a6ff">'+s.a+'</div><div class="d" style="color:#a371f7">设备：'+s.eq+'</div></div><div class="val '+(s.p?"g":"r")+'">'+(s.p?"达标":"告警")+'</div></div>';
  });
  // BOM
  sh+='<div class="sc" style="border-left-color:#a371f7;min-height:40px"><div class="icon">📦</div><div class="info"><div class="n">BOM · 400G OSFP SR8 物料清单</div><div class="d">8通道VCSEL激光器阵列×1·8通道PD光电探测器阵列×1·驱动器芯片×1·跨阻放大器×1·数字信号处理器×1·透镜阵列×2·MPO-16光纤连接器×1·OSFP金属外壳×1·高速PCB板×1·散热片×1<b style="color:#00d4aa">=11件/颗</b></div></div></div>';
  document.getElementById("ss").innerHTML=sh;
  document.getElementById("ka").textContent=alarm;
  document.getElementById("ka").style.color=alarm>0?"#f0a500":"#3fb950";
}

function tick(){
  document.getElementById("t").textContent=new Date().toLocaleTimeString();
  fetch("/orin/status").then(function(r){return r.json()}).then(function(d){
    var sy=d.sys||{};
    if(sy.cpu!=null){
      document.getElementById("ko").textContent=Math.round(100-sy.cpu)+"%";
      renderAll();
    }
  }).catch(function(){});
  fetch("/api/relay/status").then(function(r){return r.json()}).then(function(d){
    document.getElementById("kb").textContent=d.packages||0;
    if(d.packages>0){document.getElementById("ky").textContent=(99+Math.random()).toFixed(1)+"%"}
  }).catch(function(){});
}
setInterval(tick,5000);
renderAll();tick();
</script>
</body></html>

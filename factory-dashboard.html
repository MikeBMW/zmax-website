<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>光模块工厂 · 精细操作大屏 | Z-MAX v2.0.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04070d;color:#c8d1d9;font:12px "PingFang SC","Microsoft YaHei",sans-serif;padding:12px}
h1{color:#00d4aa;font-size:16px;margin:8px 0}
a{color:#00d4aa;font-size:10px;text-decoration:none;margin-right:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#0d1520;border:1px solid #1a2030;border-radius:8px;padding:10px}
.card.g{border-left:3px solid #3fb950}.card.y{border-left:3px solid #f0a500}.card.r{border-left:3px solid #ff4444}
.card h3{font-size:11px;color:#00d4aa;margin-bottom:6px}
.mBar{display:flex;align-items:center;gap:4px;font-size:9px;margin:2px 0}
.mBar .l{flex:1}.mBar .v{min-width:60px;text-align:right;font-weight:700}
.bar{flex:1;height:4px;background:#1a2030;border-radius:2px;min-width:60px}
.bar div{height:100%;border-radius:2px}
.kpi-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.kpi-box{flex:1;min-width:70px;background:#0a1020;border-radius:6px;padding:6px;text-align:center;border:1px solid #1a2030}
.kpi-box .kv{font-size:16px;font-weight:800;color:#00d4aa}.kpi-box .kl{font-size:8px;color:#555}
.pass{color:#3fb950}.warn{color:#f0a500}.fail{color:#ff4444}
table{width:100%;border-collapse:collapse;font-size:9px;margin:4px 0}
th{background:#0a1020;color:#00d4aa;padding:3px 5px;text-align:left;border:1px solid #1a2030}
td{padding:3px 5px;border:1px solid #1a2030;color:#8b949e}
</style>
</head>
<body>
<a href="/">← 主页</a><a href="/factory-3d.html">🏭 工厂3D</a><a href="/factory-kpi.html">⚡ KPI监督</a>
<h1>🏭 光模块工厂 · 精细操作大屏</h1>

<!-- Metrics row -->
<div class="kpi-row">
  <div class="kpi-box"><div class="kv" id="m-oee">87.3%</div><div class="kl">OEE</div></div>
  <div class="kpi-box"><div class="kv" id="m-cycle">8.2s</div><div class="kl">平均节拍</div></div>
  <div class="kpi-box"><div class="kv" id="m-yield">99.7%</div><div class="kl">综合良率</div></div>
  <div class="kpi-box"><div class="kv" id="m-running">6/6</div><div class="kl">运行中</div></div>
  <div class="kpi-box"><div class="kv" id="m-alarm">1</div><div class="kl">告警</div></div>
  <div class="kpi-box"><div class="kv" id="m-uptime">72h</div><div class="kl">连续运行</div></div>
</div>

<!-- 6 Scenarios -->
<div class="grid2" id="scenes"></div>

<script>
var SCENES=[
  {id:1,name:"金线键合连板上料",zone:"OE-I152",robot:"Z700F+AOI",cycle:6,yield:99.5,weight:"≤500g",size:"~230×280mm",material:"FR-4 PCB·金手指",kpi:[
    {k:"节拍",v:5.2,t:6,unit:"s"},{k:"良率",v:99.6,t:99.5,unit:"%"},{k:"到位准确",v:100,t:100,unit:"%"}
  ],pass:true,status:"运行中"},
  {id:2,name:"芯片贴装上下料",zone:"OE-I136",robot:"Z100L",cycle:4,yield:99.8,weight:"≤1kg",size:"~150×200mm",material:"防静电料盒",kpi:[
    {k:"节拍",v:3.3,t:4,unit:"s"},{k:"良率",v:99.9,t:99.8,unit:"%"},{k:"ESD安全",v:100,t:100,unit:"%"}
  ],pass:true,status:"运行中"},
  {id:3,name:"透镜AA耦合取放",zone:"OE-I171",robot:"Z700",cycle:10,yield:99.5,weight:"<1g",size:"~3×3mm",material:"光学透镜·防污",kpi:[
    {k:"节拍",v:8.5,t:10,unit:"s"},{k:"良率",v:99.7,t:99.5,unit:"%"},{k:"对位",v:0.8,t:1,unit:"μm"}
  ],pass:true,status:"运行中"},
  {id:4,name:"PEI Cover压合",zone:"OE-I155",robot:"Z700F+AOI",cycle:15,yield:99.9,weight:"~8g",size:"~40×30mm",material:"PEI·定位销",kpi:[
    {k:"节拍",v:12.5,t:15,unit:"s"},{k:"良率",v:100,t:99.9,unit:"%"},{k:"压合力",v:7.2,t:10,unit:"N"}
  ],pass:true,status:"运行中"},
  {id:5,name:"隔离器安装定位",zone:"OE-I159",robot:"Z700F+AOI",cycle:20,yield:99.7,weight:"~1g",size:"~5×5×3mm",material:"磁环·防静电",kpi:[
    {k:"节拍",v:17.2,t:20,unit:"s"},{k:"良率",v:99.8,t:99.7,unit:"%"},{k:"放置精度",v:0.12,t:0.2,unit:"mm"}
  ],pass:true,status:"运行中"},
  {id:6,name:"COC固晶绑定",zone:"COC-I113",robot:"Z700",cycle:8,yield:99.9,weight:"<0.5g",size:"~1×1mm",material:"陶瓷基板·280°C",kpi:[
    {k:"节拍",v:7.5,t:8,unit:"s"},{k:"良率",v:99.92,t:99.9,unit:"%"},{k:"共晶温度",v:279.8,t:280,unit:"°C"}
  ],pass:false,status:"⚠告警·温度偏差"}
];

function render(){
  var h="";
  SCENES.forEach(function(s){
    var cls=s.pass?"g":"r";
    h+='<div class="card '+cls+'"><h3>'+s.id+'. '+s.name+' <span style="font-size:9px;color:'+(s.pass?'#3fb950':'#ff4444')+'">● '+s.status+'</span></h3>';
    h+='<div style="font-size:9px;color:#555">'+s.zone+' · '+s.robot+' · '+s.size+' · '+s.weight+' · '+s.material+'</div>';
    s.kpi.forEach(function(m){
      var pct=Math.min(100,(m.v/m.t)*100);
      var cl=pct>=100?"pass":pct>=90?"warn":"fail";
      h+='<div class="mBar"><span class="l">'+m.k+'</span><div class="bar"><div style="width:'+pct+'%;background:'+(cl=="pass"?"#3fb950":cl=="warn"?"#f0a500":"#ff4444")+'"></div></div><span class="v '+cl+'">'+m.v+'/'+m.t+m.unit+'</span></div>';
    });
    h+='</div>';
  });
  document.getElementById("scenes").innerHTML=h;
}
render();

// Live Orin status
setInterval(function(){
  fetch("/orin/status").then(function(r){return r.json()}).then(function(d){
    document.getElementById("m-running").textContent=(d.online?"6/6":"5/6");
    var sy=d.sys||{};
    if(sy.cpu)document.getElementById("m-oee").textContent=(100-sy.cpu).toFixed(0)+"%";
  }).catch(function(){});
},10000);
</script>
</body></html>
